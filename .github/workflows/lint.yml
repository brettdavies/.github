name: Lint workflows

# pull_request only: merges to main/dev are squash merges, so a push run
# would re-lint the tree already linted at the PR head.
on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Guards the one concurrency mistake actionlint cannot model: a group keyed
  # only on caller context, which puts a reusable and its caller in one group.
  concurrency-namespacing:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check concurrency group namespacing
        run: bash scripts/check-workflow-concurrency.sh

  actionlint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@d290e336d5a743810aef4404f757dc862276d2ae # v1.73.4
        with:
          fail_level: error
