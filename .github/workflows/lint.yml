name: Lint workflows

# pull_request only: merges to main are squash merges, so a push run would
# re-lint the tree already linted at the PR head.
on:
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Guards the one concurrency mistake actionlint cannot model: a group keyed
  # only on caller context, which puts a reusable and its caller in one group.
  concurrency-namespacing:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check concurrency group namespacing
        run: bash scripts/check-workflow-concurrency.sh

  # A skipped job reports under its raw `name:` text, so an expression there
  # renames the check and a ruleset waits on a name that never reports.
  workflow-job-names:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check skippable job names
        run: bash scripts/check-workflow-job-names.sh

  # Holds every shared workflow's macOS runner label to the one in
  # .github/runner-labels.env, so the workflows move to a new image together.
  runner-labels:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check macOS runner labels
        run: bash scripts/check-runner-labels.sh

  # Holds the pre-tag build check to the rows the release builds. A row missing
  # from the check fails no run, so only this comparison reports it.
  release-matrix-parity:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release matrix parity
        run: bash scripts/check-release-matrix-parity.sh

  # Holds rust-release.yml to the tag it is given. In a dispatched release the
  # run's ref names the branch, and no run in this repository releases, so only
  # this check reports a step that reads it.
  release-tag-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the release workflow's tag source
        run: bash scripts/check-release-tag-source.sh

  # Holds each coded error annotation to a README heading. GitHub opens a link
  # whose heading is gone at the top of the page, so only this check reports
  # a renamed one.
  release-error-docs:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the error annotations' docs links
        run: bash scripts/check-release-error-docs.sh

  # Holds the search-presence gate to the permission, token, and exit
  # properties that no run in this repository exercises.
  search-presence-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the search-presence workflow contract
        run: bash scripts/check-search-presence-workflow.sh

  # Holds the cache prune to the entries it may delete. It runs only in a
  # caller's CI, against that repository's caches, so only this check reports
  # a change that deletes the entry the next run restores.
  rust-cache-prune-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the rust-cache-prune workflow contract
        run: bash scripts/check-rust-cache-prune.sh

  # Holds rust-ci's `jobs` input to its jobs: no caller run fails when a job
  # stops reading the input or the validated id list drifts from the job ids.
  rust-ci-jobs:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check rust-ci's job ids
        run: bash scripts/check-rust-ci-jobs.sh

  # Lint-basics callers reach the plan-frontmatter action only through @main,
  # so this job runs the checker's tests, the pinned yq download, and the
  # action itself from the PR's tree, on a passing and a failing plan.
  plan-frontmatter:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit tests
        run: python3 -B -m unittest discover -s actions/plan-frontmatter -p 'test_*.py' -v
      # The stub stands in for the Python yq wrapper, which forces the download.
      - name: Pinned yq download
        run: |
          set -euo pipefail
          stub="$RUNNER_TEMP/yq-stub"
          mkdir -p "$stub"
          printf '#!/bin/sh\necho "yq 3.4.3"\n' > "$stub/yq"
          chmod +x "$stub/yq"
          yq_path=$(PATH="$stub:$PATH" bash actions/plan-frontmatter/install-yq.sh "$RUNNER_TEMP/yq-download")
          test "$yq_path" = "$RUNNER_TEMP/yq-download/yq"
          "$yq_path" --version | grep -F 'mikefarah/yq/) version v4.54.1'
      - name: Write sample plans
        run: |
          set -euo pipefail
          mkdir -p sample-plans/valid sample-plans/invalid
          printf -- '---\nstatus: merged\nprs: ["#1"]\ncompleted: 2026-10-26\n---\n# Plan\n' > sample-plans/valid/merged.md
          printf -- '---\nstatus: merged\nprs: [#1]\n---\n# Plan\n' > sample-plans/invalid/merged.md
      - name: Action passes a valid plan
        uses: ./actions/plan-frontmatter
        with:
          globs: sample-plans/valid/*.md
      - name: Action fails an invalid plan
        id: invalid
        continue-on-error: true
        uses: ./actions/plan-frontmatter
        with:
          globs: sample-plans/invalid/*.md
      - name: Require the invalid plan to fail
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error title=plan frontmatter::the action passed an invalid plan (outcome: $OUTCOME)"
            exit 1
          fi

  # Lint-basics callers reach the actionlint action only through @main, so this
  # job runs the action, the real downloads, and the unit tests from the PR's
  # tree, on both architectures with pinned checksums and on the image a caller
  # gets by default.
  actionlint-action:
    name: actionlint-action (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            older_sha256: '900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a'
          - runner: ubuntu-latest
            older_sha256: '900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a'
          - runner: ubuntu-24.04-arm
            older_sha256: '21bc0dfb57a913fe175298c2a9e906ee630f747cb66d0a934d0d4b69f4ee1235'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write sample projects
        run: |
          set -euo pipefail
          mkdir -p sample/clean/.github/workflows sample/clean/.git sample/finding/.github/workflows sample/finding/.git
          printf 'on: push\njobs:\n  j:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo clean\n' \
            > sample/clean/.github/workflows/sample.yml
          printf 'on: push\njobs:\n  j:\n    runs-on: ubuntu-latest\n    nope: 1\n    steps:\n      - run: echo finding\n' \
            > sample/finding/.github/workflows/sample.yml
      - name: Action passes a clean project
        uses: ./actions/actionlint
        with:
          working-directory: sample/clean
      - name: Action fails a project with a finding
        id: finding
        continue-on-error: true
        uses: ./actions/actionlint
        with:
          working-directory: sample/finding
      - name: Require the finding to fail the action
        env:
          OUTCOME: ${{ steps.finding.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error title=actionlint action::the action passed a project with a finding (outcome: $OUTCOME)"
            exit 1
          fi
      - name: Unit tests on the default release
        env:
          ACTIONLINT_TEST_TOOLS: ${{ runner.temp }}/actionlint-tools
        run: python3 -B -m unittest discover -s actions/actionlint -p 'test_*.py' -v
      # Requires each failure's message: a case that only requires a failure also
      # passes on a failure from some other check.
      - name: Install failures name their cause
        run: |
          set -euo pipefail
          expect_failure() {
            local out
            if out=$(ACTIONLINT_VERSION=$2 ACTIONLINT_SHA256=$3 bash actions/actionlint/install-actionlint.sh "$RUNNER_TEMP/unused" 2>&1); then
              echo "::error title=actionlint action::install succeeded with version '$2' and checksum '$3'"
              exit 1
            fi
            case "$out" in
              *"$1"*) ;;
              *)
                echo "::error title=actionlint action::install failed without saying '$1'"
                exit 1
                ;;
            esac
          }
          expect_failure 'has no known checksum' 0.0.1 ''
          expect_failure 'the download is not the pinned release' 1.7.11 "$(printf 'a%.0s' {1..64})"
      - name: Action runs a caller's release and checksum
        uses: ./actions/actionlint
        with:
          version: '1.7.11'
          sha256: ${{ matrix.older_sha256 }}
          working-directory: sample/clean
      - name: Caller's release is the one installed
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/actionlint-tools/actionlint" -version | grep -Fx 1.7.11
          "$RUNNER_TEMP/actionlint-tools/shellcheck" --version | grep -Fx 'version: 0.11.0'
      - name: Action accepts a digest as GitHub prints it
        uses: ./actions/actionlint
        with:
          version: '1.7.11'
          sha256: sha256:${{ matrix.older_sha256 }}
          working-directory: sample/clean
      - name: Real findings on a caller's release
        env:
          ACTIONLINT_TEST_TOOLS: ${{ runner.temp }}/actionlint-tools
        run: python3 -B -m unittest discover -s actions/actionlint -p 'test_*.py' -k RealActionlintTest -v

  # The required check. It carries the self-test's result, so a gate that stops
  # failing on a finding cannot pass here, and it runs whatever the self-test did
  # because a required job skipped by a failed `needs` reads as passed.
  actionlint:
    needs: actionlint-action
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Require the action's self-test to pass
        env:
          SELF_TEST: ${{ needs.actionlint-action.result }}
        run: |
          if [ "$SELF_TEST" != success ]; then
            echo "::error title=actionlint::the actionlint-action self-test ended ${SELF_TEST}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/actionlint
