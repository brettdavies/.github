name: Lint workflows

# pull_request only: merges to main/dev are squash merges, so a push run
# would re-lint the tree already linted at the PR head.
on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actionlint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@49cb3ce06e5d81452e14b38ad34e4b12a8acfe2b # v1.73.3
        with:
          fail_level: error
