name: Lint workflows

# pull_request only: merges to main are squash merges, so a push run would
# re-lint the tree already linted at the PR head.
on:
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Guards the one concurrency mistake actionlint cannot model: a group keyed
  # only on caller context, which puts a reusable and its caller in one group.
  concurrency-namespacing:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check concurrency group namespacing
        run: bash scripts/check-workflow-concurrency.sh

  # Holds the pre-tag build check to the rows the release builds. A row missing
  # from the check fails no run, so only this comparison reports it.
  release-matrix-parity:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release matrix parity
        run: bash scripts/check-release-matrix-parity.sh

  # Holds the search-presence gate to the permission, token, and exit
  # properties that no run in this repository exercises.
  search-presence-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the search-presence workflow contract
        run: bash scripts/check-search-presence-workflow.sh

  # Lint-basics callers reach the plan-frontmatter action only through @main,
  # so this job runs the checker's tests, the pinned yq download, and the
  # action itself from the PR's tree, on a passing and a failing plan.
  plan-frontmatter:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit tests
        run: python3 -B -m unittest discover -s actions/plan-frontmatter -p 'test_*.py' -v
      # The stub stands in for the Python yq wrapper, which forces the download.
      - name: Pinned yq download
        run: |
          set -euo pipefail
          stub="$RUNNER_TEMP/yq-stub"
          mkdir -p "$stub"
          printf '#!/bin/sh\necho "yq 3.4.3"\n' > "$stub/yq"
          chmod +x "$stub/yq"
          yq_path=$(PATH="$stub:$PATH" bash actions/plan-frontmatter/install-yq.sh "$RUNNER_TEMP/yq-download")
          test "$yq_path" = "$RUNNER_TEMP/yq-download/yq"
          "$yq_path" --version | grep -F 'mikefarah/yq/) version v4.54.1'
      - name: Write sample plans
        run: |
          set -euo pipefail
          mkdir -p sample-plans/valid sample-plans/invalid
          printf -- '---\nstatus: merged\nprs: ["#1"]\ncompleted: 2026-10-26\n---\n# Plan\n' > sample-plans/valid/merged.md
          printf -- '---\nstatus: merged\nprs: [#1]\n---\n# Plan\n' > sample-plans/invalid/merged.md
      - name: Action passes a valid plan
        uses: ./actions/plan-frontmatter
        with:
          globs: sample-plans/valid/*.md
      - name: Action fails an invalid plan
        id: invalid
        continue-on-error: true
        uses: ./actions/plan-frontmatter
        with:
          globs: sample-plans/invalid/*.md
      - name: Require the invalid plan to fail
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error title=plan frontmatter::the action passed an invalid plan (outcome: $OUTCOME)"
            exit 1
          fi

  actionlint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@a8ac3eea598697a830f7d8e701fc9fcbfde88974 # v1.80.0
        with:
          fail_level: error
