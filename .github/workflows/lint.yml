name: Lint workflows

# pull_request only: merges to main are squash merges, so a push run would
# re-lint the tree already linted at the PR head.
on:
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Guards the one concurrency mistake actionlint cannot model: a group keyed
  # only on caller context, which puts a reusable and its caller in one group.
  concurrency-namespacing:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check concurrency group namespacing
        run: bash scripts/check-workflow-concurrency.sh

  # Holds the pre-tag build check to the rows the release builds. A row missing
  # from the check fails no run, so only this comparison reports it.
  release-matrix-parity:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release matrix parity
        run: bash scripts/check-release-matrix-parity.sh

  # Holds the search-presence gate to the permission, token, and exit
  # properties that no run in this repository exercises.
  search-presence-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the search-presence workflow contract
        run: bash scripts/check-search-presence-workflow.sh

  actionlint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@a8ac3eea598697a830f7d8e701fc9fcbfde88974 # v1.80.0
        with:
          fail_level: error
