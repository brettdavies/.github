# Reusable workflow to verify commits in PRs to main came from dev PRs.
# Checks that every non-exempt commit has a (#N) PR reference in its message,
# indicating it was squash-merged from a feature PR to dev.
#
# Skipped for release/* branches — cherry-picks from dev inherently lose PR
# references, and the release PR itself is the review gate.
#
# Housekeeping commits authored directly against main are exempt, and they
# arrive in two shapes. A housekeeping TYPE: docs:, chore:, ci:, style:,
# build:. Or a product type carrying a housekeeping SCOPE: fix(ci):,
# feat(hooks):, fix(release):. The fleet standard prefers feat/fix over chore
# for anything a user can observe, and cliff.toml drops chore/ci/build/style
# /test from changelogs, so internal CI, hook and release-tooling work is
# written as fix(ci) and fix(hooks) by design. Matching the type alone read
# those as product code and demanded a PR reference they can never carry.
#
# test: is NOT exempt in either shape — tests are code and must go through PRs.
#
# Caller example:
#   jobs:
#     guard-provenance:
#       uses: brettdavies/.github/.github/workflows/guard-main-provenance.yml@main
#
# Required caller permissions: pull-requests: read
name: Guard main commit provenance

on:
  workflow_call:

# A literal token leads the group key. Inside a called workflow
# `github.workflow` resolves to the *caller's* workflow name, so a key built
# only from context is one a caller also produces for its own group; both then
# land in one group and this workflow's queue cancels the run that called it.
# The caller and ref parts stay so callers, and refs within a caller, separate.
concurrency:
  group: guard-main-provenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-provenance:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Verify commits have PR references
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Skip for release branches — cherry-picks lose PR references by design
            const headRef = context.payload.pull_request.head.ref;
            if (/^release\//.test(headRef)) {
              core.info(`Skipping provenance check for release branch: ${headRef}`);
              return;
            }

            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            // A housekeeping type, in any scope.
            const exemptType = /^(docs|chore|ci|style|build)(\(.+\))?!?:/i;
            // A housekeeping scope, under any type except `test`. A test is
            // code wherever it is scoped, so `test(ci):` stays unexempt and
            // the lookahead is what keeps the scope branch from readmitting
            // the one type the type branch deliberately excludes.
            const exemptScope = /^(?!test\()[a-z]+\((ci|hooks|workflows|build|release|style|docs)\)!?:/i;
            const prRef = /\(#\d+\)/;

            const violations = commits
              .map(c => c.commit.message.split('\n')[0])
              .filter(msg => !exemptType.test(msg) && !exemptScope.test(msg) && !prRef.test(msg));

            if (violations.length > 0) {
              core.setFailed(
                `Commits must come from PRs to dev (squash commits include (#N) references).\n` +
                `The following commits have no PR reference and are not exempt:\n` +
                violations.map(m => `  - ${m}`).join('\n') + '\n\n' +
                `Exempt types: docs:, chore:, ci:, style:, build:\n` +
                `Exempt scopes, under any type: (ci), (hooks), (workflows), (build), (release), (style), (docs)\n` +
                `Fix: use feature PRs to dev instead of committing directly to the release branch.`
              );
            } else {
              core.info(`All ${commits.length} commit(s) have PR references or are exempt. OK.`);
            }
