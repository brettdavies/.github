# Reusable workflow to block compound-engineering docs from main.
# Checks PRs for added/modified files in guarded docs paths.
#
# Caller example:
#   jobs:
#     guard-docs:
#       uses: brettdavies/.github/.github/workflows/guard-main-docs.yml@main
#
# Caller with extra paths (extends the hardcoded base list):
#   jobs:
#     guard-docs:
#       uses: brettdavies/.github/.github/workflows/guard-main-docs.yml@main
#       with:
#         extra_paths: 'styles/,.vale.ini,scripts/prose-check.sh,**/.agent/'
#
# Required caller permissions: pull-requests: read
name: Guard main from engineering docs

on:
  workflow_call:
    inputs:
      extra_paths:
        description: |
          Comma-separated list of additional paths to forbid alongside the
          hardcoded engineering-docs base list. Entries ending with `/` match
          by prefix (e.g. `styles/`); other entries match by exact filename
          (e.g. `.vale.ini`). Entries starting with `**/` match at any
          directory depth: `**/.agent/` forbids an `.agent/` directory at the
          repo root and in every subtree (e.g. `vendor/x/.agent/…`), and
          `**/TODO.md` forbids that filename at any depth. Empty by default —
          callers that only need the base list omit this input.
        required: false
        type: string
        default: ''

permissions:
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-forbidden-docs:
    runs-on: ubuntu-22.04
    steps:
      - name: Get changed files
        id: changed
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          EXTRA_PATHS: ${{ inputs.extra_paths }}
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const baseHardcoded = [
              'docs/architecture/',
              'docs/brainstorms/',
              'docs/ideation/',
              'docs/plans/',
              'docs/research/',
              'docs/reviews/',
              'docs/solutions/',
            ];
            const extra = (process.env.EXTRA_PATHS || '')
              .split(',')
              .map(s => s.trim())
              .filter(s => s.length > 0);
            const allPatterns = [...baseHardcoded, ...extra];
            const matches = (f, p) => {
              if (p.startsWith('**/')) {
                const s = p.slice(3);
                return s.endsWith('/')
                  ? f.startsWith(s) || f.includes('/' + s)
                  : f === s || f.endsWith('/' + s);
              }
              return p.endsWith('/') ? f.startsWith(p) : f === p;
            };
            const forbidden = files
              .filter(f => f.status === 'added' || f.status === 'modified')
              .map(f => f.filename)
              .filter(f => allPatterns.some(p => matches(f, p)));
            if (forbidden.length > 0) {
              core.setFailed(
                `Forbidden paths must not be merged into main:\n` +
                forbidden.map(f => `  - ${f}`).join('\n')
              );
            } else {
              core.info('No forbidden docs found. OK.');
            }
