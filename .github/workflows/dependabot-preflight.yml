# Reusable preflight workflow: enumerate pending dependency updates before
# cutting a release branch, so they can be merged on dev (or rejected) rather
# than landing as Dependabot PRs the moment the release commit hits the
# target branch.
#
# Two ecosystems supported:
#   - `cargo` — runs `cargo outdated --workspace --depth 1` and writes the
#     report to $GITHUB_STEP_SUMMARY. Exits non-zero if any direct dep has
#     a newer compatible version available (so the run flags red in the UI
#     to signal "needs attention").
#   - `github-actions` — diffs every `uses: <action>@<sha>` line against the
#     resolved latest tag of the action's repo. Writes drift to summary.
#
# Caller example (workflow_dispatch wrapper):
#
#   name: Dependabot Preflight
#   on:
#     workflow_dispatch:
#   permissions:
#     contents: read
#     pull-requests: read
#   jobs:
#     preflight:
#       uses: brettdavies/.github/.github/workflows/dependabot-preflight.yml@<sha>
#
# Run from Actions tab → "Dependabot Preflight" → "Run workflow" before
# starting RELEASES-PREFLIGHT.md. If pending updates exist, merge them on
# dev (or trigger Dependabot via Insights → Dependency graph → Dependabot)
# BEFORE cutting the release branch.
name: Dependabot Preflight

on:
  workflow_call:
    inputs:
      ecosystems:
        description: 'Comma-separated ecosystems to scan (cargo, github-actions)'
        required: false
        type: string
        default: 'cargo,github-actions'
      cargo_fail_on_outdated:
        description: 'Exit non-zero when cargo deps have newer compatible versions'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cargo:
    if: contains(inputs.ecosystems, 'cargo')
    name: Cargo outdated check
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: dependabot-preflight

      - name: Install cargo-outdated
        uses: taiki-e/install-action@be7c31b6745feec79dec5eb79178466c0670bb2d # v2.62.20
        with:
          tool: cargo-outdated

      - name: Run cargo outdated
        id: outdated
        env:
          FAIL: ${{ inputs.cargo_fail_on_outdated }}
        run: |
          set -o pipefail
          {
            echo '## Cargo outdated (direct dependencies)'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # `--exit-code 1` makes cargo-outdated return non-zero when any
          # direct dep has a newer compatible version. Capture into a file
          # so we can tee to both the step summary and the action log.
          if cargo outdated --workspace --depth 1 -R --exit-code 1 \
              | tee /tmp/outdated.txt; then
            outdated_count=0
          else
            outdated_count=1
          fi
          cat /tmp/outdated.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "outdated_count=$outdated_count" >> "$GITHUB_OUTPUT"

          if [ "$outdated_count" -gt 0 ] && [ "$FAIL" = "true" ]; then
            echo "::warning::Cargo deps have available updates; review the report above before cutting the release."
            exit 1
          fi

  github-actions:
    if: contains(inputs.ecosystems, 'github-actions')
    name: GitHub Actions pin-drift check
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enumerate pinned actions and resolve latest tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          workflows=(.github/workflows/*.yml .github/workflows/*.yaml)

          drift_count=0
          processed=()
          # shellcheck disable=SC2034  # appended via newer_rows+=("$row") below
          newer_rows=()
          # shellcheck disable=SC2034  # appended via ok_rows+=("$row") below
          ok_rows=()

          # Strict shape: `uses: <owner>/<repo>[/path...]@<ref>` at start of
          # line after whitespace, allowing the optional `- ` YAML list-item
          # prefix used for `steps: - uses: ...`. Owner segment must start
          # with an alphanumeric so embedded shell strings (e.g. `grep '...
          # uses: ...'`) and comment-style placeholders (`uses: <action>@<sha>`)
          # don't match.
          uses_re='^[[:space:]]*-?[[:space:]]*uses:[[:space:]]+[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9._/-]+@[A-Za-z0-9._/-]+'

          for wf in "${workflows[@]}"; do
            wf_name="$(basename "$wf")"
            # Extract `owner/repo@sha # comment` triples; skip local paths,
            # `./.github/...` re-uses, and first-party brettdavies/... refs
            # (carve-out: first-party reusables intentionally use @main,
            # see ~/.claude/guides/supply-chain-pinning.md).
            while IFS= read -r line; do
              ref="$(echo "$line" \
                | sed -E 's/^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*//; s/[[:space:]]+$//')"
              [[ "$ref" == ./* ]] && continue
              [[ "$ref" != */*@* ]] && continue
              repo="${ref%@*}"
              [[ "$repo" == brettdavies/* ]] && continue
              sha_and_comment="${ref#*@}"
              sha="$(echo "$sha_and_comment" | awk '{print $1}')"
              comment="$(echo "$sha_and_comment" \
                | sed -E 's/^[^#]*#[[:space:]]*//; t; d')"

              # Dedup: same repo+sha appears in many workflows
              key="$repo@$sha"
              if printf '%s\n' "${processed[@]}" | grep -qxF "$key"; then
                continue
              fi
              processed+=("$key")

              # Resolve latest release tag for the action's repo
              latest="$(gh api "repos/$repo/releases/latest" \
                --jq '.tag_name' 2>/dev/null || true)"
              if [ -z "$latest" ]; then
                latest="$(gh api "repos/$repo/tags" --jq '.[0].name' \
                  2>/dev/null || echo 'n/a')"
              fi

              row="$(printf '| %s | %s | %s | %s |' \
                "$wf_name" "$repo" "${comment:-(no comment)}" "$latest")"

              if [ "$latest" != "n/a" ] \
                  && [ -n "$comment" ] \
                  && [ "$comment" != "$latest" ]; then
                newer_rows+=("$row")
                drift_count=$((drift_count + 1))
              else
                ok_rows+=("$row")
              fi
            done < <(grep -E "$uses_re" "$wf" || true)
          done

          # Emit sorted summary: newer-section first (drift, actionable),
          # then ok-section (informational).
          {
            echo '## GitHub Actions pin drift'
            echo
            if [ "${#newer_rows[@]}" -gt 0 ]; then
              echo "### \`newer\` (${#newer_rows[@]}) — needs attention"
              echo
              echo '| Workflow | Action | Pinned (comment) | Latest tag |'
              echo '| --- | --- | --- | --- |'
              printf '%s\n' "${newer_rows[@]}"
              echo
            fi
            if [ "${#ok_rows[@]}" -gt 0 ]; then
              echo "### \`ok\` (${#ok_rows[@]}) — up to date"
              echo
              echo '| Workflow | Action | Pinned (comment) | Latest tag |'
              echo '| --- | --- | --- | --- |'
              printf '%s\n' "${ok_rows[@]}"
              echo
            fi
            echo "_Total entries with drift: ${drift_count}_"
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail the job if any pin drifted, so the run flags red in the
          # Actions UI rather than quietly reporting in the summary tab.
          if [ "$drift_count" -gt 0 ]; then
            echo "::warning::${drift_count} action pin(s) have newer releases; review the summary above."
            exit 1
          fi
