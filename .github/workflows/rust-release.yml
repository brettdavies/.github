# Reusable release workflow for brettdavies Rust CLI tools.
# Builds cross-platform binaries, publishes to crates.io, creates GitHub
# Release, and dispatches Homebrew formula update.
#
# Caller example:
#   jobs:
#     pipeline:
#       uses: brettdavies/.github/.github/workflows/rust-release.yml@main
#       with:
#         crate: bird
#         bin: bird
#         linux_musl_required: true       # optional, default false
#         linux_musl_verify_alpine: true  # optional, default false
#       secrets:
#         CI_RELEASE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
#
# Build matrix is 7 targets: x86_64/aarch64 linux-gnu, x86_64/aarch64 linux-musl,
# x86_64/aarch64 darwin, x86_64 windows-msvc. The two musl rows soft-fail by
# default; set linux_musl_required: true once a consumer has verified its build.
# Set linux_musl_verify_alpine: true to additionally exec the x86_64 musl
# binary inside alpine:latest as a belt-and-suspenders compatibility check.
#
# Required caller permissions: contents: write, id-token: write
name: Rust Release

on:
  workflow_call:
    inputs:
      crate:
        description: "Crate name (e.g., bird, xurl-rs)"
        type: string
        required: true
      bin:
        description: "Binary name (e.g., bird, xr)"
        type: string
        required: true
      linux_musl_required:
        description: "Block release on linux-musl build failure. Default false: musl rows soft-fail and the artifact is omitted from the release. Set true once the consumer crate has verified it builds clean against musl."
        type: boolean
        required: false
        default: false
      linux_musl_verify_alpine:
        description: "Belt-and-suspenders: after building x86_64-unknown-linux-musl, run the binary inside an alpine:latest container to confirm musl-static actually exec-compatible (catches dlopen/NSS/locale surprises that pass `file --statically-linked`). Default false. Independent of linux_musl_required — failure semantics flow through that flag."
        type: boolean
        required: false
        default: false
    secrets:
      CI_RELEASE_TOKEN:
        description: "Fine-grained PAT with contents:write for release automation (Homebrew dispatch, changelog, rulesets)"
        required: true

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-22.04
    steps:
      - name: Validate crate and bin names
        env:
          CRATE: ${{ inputs.crate }}
          BIN: ${{ inputs.bin }}
        run: |
          if [[ ! "$CRATE" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Invalid crate name: $CRATE"
            exit 1
          fi
          if [[ ! "$BIN" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Invalid binary name: $BIN"
            exit 1
          fi

  check-version:
    needs: validate-inputs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # cargo pkgid output varies: `path+file:///path#0.1.1` on some
          # setups, `name@0.1.1` on others (cargo picks the shortest
          # unambiguous form). Strip through the last `#` OR `@` so both
          # shapes collapse to the bare version.
          CARGO_VERSION=$(cargo pkgid | sed -E 's|.*[@#]||')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi

  audit:
    needs: validate-inputs
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        checks: [advisories, "bans licenses sources"]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2.0.15
        with:
          command: check ${{ matrix.checks }}

  build:
    needs: [check-version, audit]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every row declares `soft_fail` explicitly (true on the linux-musl
        # rows, false on every other row). Implicit "no soft_fail key →
        # hard-fail" reads naturally but breaks the `continue-on-error`
        # expression below: `matrix.soft_fail` was undefined for non-musl
        # rows, evaluating to `null && X` (= null) at job level, which GHA
        # silently rejects — the entire build job's matrix expansion was
        # skipped, taking publish-crate / release / homebrew with it (see
        # agentnative-cli's failed v0.3.1 release run on 2026-05-04).
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            soft_fail: false
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true
            soft_fail: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            cross: true
            soft_fail: true
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            cross: true
            soft_fail: true
          - os: macos-14
            target: aarch64-apple-darwin
            soft_fail: false
          - os: macos-latest
            target: x86_64-apple-darwin
            soft_fail: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            soft_fail: false

    runs-on: ${{ matrix.os }}
    # Soft-fail rows (currently the two linux-musl targets) fail open by
    # default. The release proceeds without their artifacts. Consumers
    # opt into hard-fail by passing `linux_musl_required: true`. The
    # `== true` belt is paired with the `soft_fail: false` suspenders on
    # every non-musl row above — together they make the expression
    # always-boolean and make every row's stance grep-able.
    continue-on-error: ${{ matrix.soft_fail == true && !inputs.linux_musl_required }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # When a consumer repo ships a `rust-toolchain.toml` pinning the
      # toolchain, `dtolnay/rust-toolchain` honours the TOML's channel but
      # installs only the host default target; the `targets:` input above
      # is silently ignored for the pinned toolchain. Re-add the matrix
      # target explicitly so cross-compile builds don't fail with
      # "can't find crate for `core`".
      # Skipped when `cross: true` because the cross docker image brings
      # its own pre-configured toolchain.
      - name: Ensure target installed
        if: matrix.cross != true
        run: rustup target add ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall cross --version 0.2.5 --no-confirm --force

      - name: Determine binary name
        id: binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ inputs.bin }}
        run: |
          if [[ "$TARGET" == *windows* ]]; then
            echo "name=${BIN}.exe" >> "$GITHUB_OUTPUT"
          else
            echo "name=${BIN}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release
        id: build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross }}
        run: |
          BUILD_CMD="cargo"
          if [ "$USE_CROSS" = "true" ]; then
            BUILD_CMD="cross"
          fi
          $BUILD_CMD build --release --locked --target "$TARGET"

      # Soft-fail rows surface their failure as a job-summary warning so the
      # omitted artifact is loud in the run UI even though the release proceeds.
      # Skipped when the consumer opts into hard-fail (linux_musl_required: true).
      - name: Annotate soft-failed build
        if: failure() && matrix.soft_fail == true && !inputs.linux_musl_required
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          echo "::warning::${TARGET} build failed in soft-fail mode; artifact will be omitted from release"
          {
            echo "## ⚠️ \`${TARGET}\` build failed (soft-fail)"
            echo ""
            echo "This target is configured to fail open. The release will proceed without the \`${TARGET}\` artifact."
            echo ""
            echo "To make this target block the release, pass \`linux_musl_required: true\` from the caller's \`release.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Belt-and-suspenders Alpine exec validation — opt-in via
      # linux_musl_verify_alpine: true. x86_64 only; the static-link mechanism
      # is identical across arches, so one Alpine confirmation closes the
      # exec-compatibility question for both musl rows. Gated on success() so
      # the binary actually exists. Failure flows through the same soft/hard
      # path as the build itself (matrix.soft_fail + linux_musl_required).
      - name: Verify musl binary exec-compatible with Alpine
        if: success() && inputs.linux_musl_verify_alpine && matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ steps.binary.outputs.name }}
        run: |
          BIN_DIR="target/${TARGET}/release"
          # --pull always defeats any stale cached image. -v read-only so the
          # container can't write back. Direct exec of the binary (no shell
          # wrapping) so any dynamic-link surprise surfaces immediately.
          docker run --rm --pull always \
            -v "$PWD/$BIN_DIR:/musl-bin:ro" \
            alpine:latest \
            "/musl-bin/${BINARY}" --version

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ inputs.bin }}
        run: |
          codesign --force --sign - "target/${TARGET}/release/${BIN}"
          codesign --verify --verbose "target/${TARGET}/release/${BIN}"

      - name: Create archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CRATE: ${{ inputs.crate }}
          BINARY: ${{ steps.binary.outputs.name }}
        run: |
          STAGING="${CRATE}-${TARGET}"
          mkdir -p "$STAGING"
          cp "target/${TARGET}/release/${BINARY}" "$STAGING/"
          cp LICENSE-MIT LICENSE-APACHE README.md "$STAGING/"
          cp -r completions "$STAGING/"
          if [[ "$TARGET" == *windows* ]]; then
            7z a "${STAGING}.zip" "$STAGING"
          else
            tar czf "${STAGING}.tar.gz" "$STAGING"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.crate }}-${{ matrix.target }}
          path: ${{ inputs.crate }}-${{ matrix.target }}.*

  publish-crate:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec # v1.0.3

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  release:
    needs: [build, publish-crate]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          # Anchor on the section whose '## ' heading contains the tag's version,
          # not blindly the first section: a tag cut before its changelog entry
          # landed, or an '## [Unreleased]' block at the top, would otherwise
          # ship the wrong section silently. check-version has already verified
          # the tag matches the crate version.
          NOTES=$(awk -v ver="${GITHUB_REF_NAME#v}" '/^## /{if(f)exit; if(index($0,ver))f=1} f' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG.md section for ${GITHUB_REF_NAME}; falling back to generated notes"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "content<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Prepare release assets and checksums
        env:
          CRATE: ${{ inputs.crate }}
        run: |
          mkdir -p release
          for dir in "artifacts/${CRATE}-"*; do
            [ ! -d "$dir" ] && continue
            cp "$dir"/*.tar.gz "$dir"/*.zip release/ 2>/dev/null || true
          done
          cd release
          if [ -z "$(ls -A)" ]; then
            echo "::error::No release artifacts found"
            exit 1
          fi
          sha256sum ./* > sha256sum.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: release/*
          body: ${{ steps.changelog.outputs.content }}
          generate_release_notes: ${{ steps.changelog.outputs.generate == 'true' }}
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch Homebrew formula update
        env:
          GH_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          VERSION: ${{ github.ref_name }}
          CRATE: ${{ inputs.crate }}
          REPO: ${{ github.repository }}
        run: |
          gh api repos/brettdavies/homebrew-tap/dispatches \
            --method POST \
            -f event_type=update-formula \
            -f "client_payload[formula]=${CRATE}" \
            -f "client_payload[version]=${VERSION#v}" \
            -f "client_payload[repo]=${REPO}"
