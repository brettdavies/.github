# Reusable release workflow for brettdavies Rust CLI tools.
# Builds cross-platform binaries, publishes to crates.io, creates GitHub
# Release, and dispatches Homebrew formula update.
#
# Caller example (README.md § rust-release.yml has the full caller, which
# dispatches the release onto main from the tag push):
#   jobs:
#     pipeline:
#       uses: brettdavies/.github/.github/workflows/rust-release.yml@main
#       with:
#         tag: ${{ inputs.tag }}
#         crate: bird
#         bin: bird
#         linux_musl_required: true       # optional, default false
#         linux_musl_verify_alpine: true  # optional, default false
#         artifact_name: bird             # optional, default the crate name
#         attest: true                    # optional, default false
#       secrets:
#         CI_RELEASE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
#
# The `tag` input names the release, and no step reads the run's ref, which
# names the branch when the caller dispatches the release onto it to restore
# that branch's caches. validate-inputs refuses a tag that is not
# v<major>.<minor>.<patch>, one that does not exist, and one whose commit is not
# the commit the run builds, before anything builds.
#
# The builds start beside the version check, the audits, and the SBOM, and
# signing and publishing wait for all of them. A failed required build row
# cancels the others. Before it publishes, the crate waits up to ten minutes for
# every workspace member it depends on to reach crates.io at its bound, so a
# library tag pushed beside this one publishes first. The publish skips the
# verify compile: the caller runs `cargo publish --dry-run` in the pull-request
# gate the tagged tree merged through.
#
# Build matrix is 7 targets: x86_64/aarch64 linux-gnu, x86_64/aarch64 linux-musl,
# x86_64/aarch64 darwin, x86_64 windows-msvc. The two musl rows soft-fail by
# default; set linux_musl_required: true once a consumer has verified its build.
# Both darwin rows build on macos-15, x86_64 cross-built beside arm64, for the
# macOS release `macos_deployment_target` names (15.0 unless set); a build
# fails when any object it links declares a newer one.
# Set linux_musl_verify_alpine: true to additionally exec the x86_64 musl
# binary inside alpine:latest as a belt-and-suspenders compatibility check.
#
# Set attest: true to attest what the build jobs produced, before anything is
# published: every archive and sha256sum.txt gets build provenance, and a
# CycloneDX SBOM of the binary is attested against the archives. Nothing is
# published unless that succeeds, and the Homebrew dispatch waits until every
# published file has been verified against its attestation. This workflow is
# the signer, so a release verifies with:
#   gh attestation verify <archive> --repo <owner>/<repo> \
#     --signer-workflow brettdavies/.github/.github/workflows/rust-release.yml
#
# Required caller permissions: contents: write, id-token: write, and with
# attest: true also attestations: write
name: Rust Release

on:
  workflow_call:
    inputs:
      tag:
        description: "The release tag, `v<major>.<minor>.<patch>`. It must exist and point at the commit the run checked out: a caller that dispatches the release onto its default branch passes the tag it was dispatched for, and one that runs on the tag push passes the pushed tag."
        type: string
        required: true
      crate:
        description: "Crate name (e.g., bird, xurl-rs)"
        type: string
        required: true
      bin:
        description: "Binary name (e.g., bird, xr)"
        type: string
        required: true
      linux_musl_required:
        description: "Block release on linux-musl build failure. Default false: musl rows soft-fail and the artifact is omitted from the release. Set true once the consumer crate has verified it builds clean against musl."
        type: boolean
        required: false
        default: false
      linux_musl_verify_alpine:
        description: "Belt-and-suspenders: after building x86_64-unknown-linux-musl, run the binary inside an alpine:latest container to confirm musl-static actually exec-compatible (catches dlopen/NSS/locale surprises that pass `file --statically-linked`). Default false. Independent of linux_musl_required — failure semantics flow through that flag."
        type: boolean
        required: false
        default: false
      changelog:
        description: "Path to the changelog the release notes are cut from, relative to the repository root. Empty means the repository root's `CHANGELOG.md`; a workspace whose member keeps its own beside its manifest passes that path."
        type: string
        required: false
        default: ""
      artifact_name:
        description: "Prefix of every archive and release asset (`<artifact_name>-<target>.tar.gz`). Empty means the crate name, which is what every existing download URL and binstall `pkg-url` carries; set it only when the published package is renamed and the download names must not follow."
        type: string
        required: false
        default: ""
      macos_deployment_target:
        description: "The oldest macOS the darwin binaries run on, set as MACOSX_DEPLOYMENT_TARGET for the whole build so Rust and the C code a build script compiles declare the same minimum. Default `15.0`. The build fails when the binary or any `.a` or `.o` under its build directory declares a newer one."
        type: string
        required: false
        default: "15.0"
      attest:
        description: "Attest the release. Default false. When true, every archive the build jobs produced and `sha256sum.txt` get a build-provenance attestation and a CycloneDX SBOM of the binary is attested against the archives, all before anything is published; a failed attestation publishes nothing, and the Homebrew dispatch waits for every published file to verify. The caller then grants `attestations: write` beside `id-token: write`."
        type: boolean
        required: false
        default: false
    secrets:
      CI_RELEASE_TOKEN:
        description: "Fine-grained PAT with contents:write for release automation (Homebrew dispatch, changelog, rulesets)"
        required: true

# The key leads with this file's own token. `release-` alone is a key a caller's
# own release workflow produces for itself, and two declarations that resolve to
# one string are one group. Never cancels: a run killed part way leaves a
# half-published release.
concurrency:
  group: rust-release-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate crate, bin, and artifact names
        env:
          CRATE: ${{ inputs.crate }}
          BIN: ${{ inputs.bin }}
          ARTIFACT: ${{ inputs.artifact_name }}
        run: |
          if [[ ! "$CRATE" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Invalid crate name: $CRATE"
            exit 1
          fi
          if [[ ! "$BIN" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Invalid binary name: $BIN"
            exit 1
          fi
          if [[ -n "$ARTIFACT" && ! "$ARTIFACT" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Invalid artifact name: $ARTIFACT"
            exit 1
          fi

      # A dispatched run takes its tag as an input, which no tag pattern
      # filters, and builds the commit of the ref it was dispatched onto. The
      # tag has to be a release tag that exists and names that commit, or the
      # archives would carry another commit's code under the tag's name. A
      # dispatch onto a branch that has moved past the tag is refused here,
      # before anything builds.
      - name: Resolve the tag to the commit this run builds
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CALLER: ${{ github.workflow_ref }}
          DOCS: https://github.com/brettdavies/.github/blob/main/README.md
        run: |
          set -euo pipefail
          caller="${CALLER%%@*}"
          caller="${caller##*/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=release-tag-invalid::tag '${TAG}' is not a release tag: it must match ^v[0-9]+\.[0-9]+\.[0-9]+$, the form the binary's releases are tagged in. Nothing was built or published. Dispatch with the binary's tag: gh workflow run ${caller} --repo ${GITHUB_REPOSITORY} --ref <tag> -f tag=<tag>. See ${DOCS}#release-tag-invalid"
            exit 1
          fi
          err="$RUNNER_TEMP/tag-resolve.err"
          if ! object=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha' 2> "$err"); then
            if grep -q 'HTTP 404' "$err"; then
              echo "::error title=release-tag-missing::${GITHUB_REPOSITORY} has no tag ${TAG}. Nothing was built or published. Push the tag, then dispatch with it: gh workflow run ${caller} --repo ${GITHUB_REPOSITORY} --ref ${TAG} -f tag=${TAG}. See ${DOCS}#release-tag-missing"
              exit 1
            fi
            cat "$err" >&2
            echo "::error::could not read tag ${TAG} from ${GITHUB_REPOSITORY}: $(head -n 1 "$err")"
            exit 1
          fi
          read -r type sha <<<"$object"
          # An annotated tag names a tag object, which names the commit.
          while [ "$type" = tag ]; do
            object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.type + " " + .object.sha')
            read -r type sha <<<"$object"
          done
          if [ "$type" != commit ]; then
            echo "::error title=release-tag-missing::tag ${TAG} names a ${type}, not a commit. Nothing was built or published. See ${DOCS}#release-tag-missing"
            exit 1
          fi
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error title=release-tag-moved::tag ${TAG} is commit ${sha}, and this run builds ${GITHUB_SHA}: the branch it was dispatched onto has moved past the tag. Nothing was built or published. Release from the tag's own ref, on cold caches: gh workflow run ${caller} --repo ${GITHUB_REPOSITORY} --ref ${TAG} -f tag=${TAG}. See ${DOCS}#release-tag-moved"
            exit 1
          fi
          echo "Releasing ${TAG}, commit ${sha}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  check-version:
    needs: validate-inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches the crate's Cargo.toml version
        env:
          CRATE: ${{ inputs.crate }}
          TAG: ${{ needs.validate-inputs.outputs.tag }}
          TAG_VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          # `-p` names the package: a bare `cargo pkgid` errors on a workspace
          # root that is a virtual manifest. cargo pkgid output varies:
          # `path+file:///path#0.1.1` on some setups, `name@0.1.1` on others
          # (cargo picks the shortest unambiguous form). Strip through the
          # last `#` OR `@` so both shapes collapse to the bare version.
          CARGO_VERSION=$(cargo pkgid -p "$CRATE" | sed -E 's|.*[@#]||')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag ${TAG} does not match ${CRATE} version ${CARGO_VERSION}"
            exit 1
          fi

  audit:
    needs: validate-inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        checks: [advisories, "bans licenses sources"]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  # The builds wait only for the inputs, so they run beside the version check,
  # the audits, and the SBOM; everything that signs or publishes waits for all
  # of them. A failed required row cancels the rest, since the release cannot
  # proceed without it, and `gh run rerun <id> --failed` builds them again. A
  # soft-fail row's failure cancels nothing: its `continue-on-error` keeps it
  # out of fail-fast.
  build:
    needs: validate-inputs
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        # Every row declares `soft_fail` explicitly (true on the linux-musl
        # rows, false on every other row). Implicit "no soft_fail key →
        # hard-fail" reads naturally but breaks the `continue-on-error`
        # expression below: `matrix.soft_fail` was undefined for non-musl
        # rows, evaluating to `null && X` (= null) at job level, which GHA
        # silently rejects — the entire build job's matrix expansion was
        # skipped, taking publish-crate / release / homebrew with it (see
        # agentnative-cli's failed v0.3.1 release run on 2026-05-04).
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            soft_fail: false
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true
            soft_fail: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            cross: true
            soft_fail: true
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            cross: true
            soft_fail: true
          - os: macos-15
            target: aarch64-apple-darwin
            soft_fail: false
          - os: macos-15
            target: x86_64-apple-darwin
            soft_fail: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            soft_fail: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Soft-fail rows (currently the two linux-musl targets) fail open by
    # default. The release proceeds without their artifacts. Consumers
    # opt into hard-fail by passing `linux_musl_required: true`. The
    # `== true` belt is paired with the `soft_fail: false` suspenders on
    # every non-musl row above — together they make the expression
    # always-boolean and make every row's stance grep-able.
    continue-on-error: ${{ matrix.soft_fail == true && !inputs.linux_musl_required }}
    # Set for the job, so cargo, rustc, and every build script's C compiler
    # see one value, and empty off darwin, so no other row's cache key moves.
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ contains(matrix.target, 'apple-darwin') && inputs.macos_deployment_target || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      # When a consumer repo ships a `rust-toolchain.toml` pinning the
      # toolchain, `dtolnay/rust-toolchain` honours the TOML's channel but
      # installs only the host default target; the `targets:` input above
      # is silently ignored for the pinned toolchain. Re-add the matrix
      # target explicitly so cross-compile builds don't fail with
      # "can't find crate for `core`".
      # Skipped when `cross: true` because the cross docker image brings
      # its own pre-configured toolchain.
      - name: Ensure target installed
        if: matrix.cross != true
        run: rustup target add ${{ matrix.target }}

      # The deployment target joins the key, so a darwin build never restores
      # C objects compiled for another one.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          env-vars: MACOSX_DEPLOYMENT_TARGET

      - name: Install cargo-binstall
        if: matrix.cross
        uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2

      - name: Install cross
        if: matrix.cross
        run: cargo binstall cross --version 0.2.5 --no-confirm --force

      # cross asks `cargo metadata` on the host before it starts its image, and
      # builds on the host when that call fails. Fetching first installs the
      # toolchain the caller pins and downloads every crate, so the call has
      # nothing left to fetch. scripts/check-release-matrix-parity.sh holds
      # the cross steps and `Build release` to the same text in both release
      # workflows.
      - name: Fetch crates for cross
        if: matrix.cross
        run: cargo fetch --locked

      - name: Determine binary name
        id: binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ inputs.bin }}
        run: |
          if [[ "$TARGET" == *windows* ]]; then
            echo "name=${BIN}.exe" >> "$GITHUB_OUTPUT"
          else
            echo "name=${BIN}" >> "$GITHUB_OUTPUT"
          fi

      # A host build is not the image's build, even when it succeeds: it links
      # against the runner's libraries, not the target's. So the step fails
      # whenever cross prints its fallback note, and names the warning before
      # it, which is the cause.
      - name: Build release
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          if [ "$USE_CROSS" != "true" ]; then
            cargo build --release --locked --target "$TARGET"
            exit 0
          fi
          log="$RUNNER_TEMP/cross-build.log"
          status=0
          cross build --release --locked --target "$TARGET" 2>&1 | tee "$log" || status=$?
          # shellcheck disable=SC2016 # the backticks are cross's own text
          if grep -qF 'Falling back to `cargo` on the host' "$log"; then
            cause=$(grep -m 1 -F '[cross] warning:' "$log" | sed 's/^\[cross\] warning: //' || true)
            echo "::error title=cross-host-fallback::cross did not build ${TARGET} in its image and fell back to cargo on the host (${cause:-cross printed no cause}), so this build is not the image's. Nothing was published. Rerun the failed jobs with: gh run rerun ${GITHUB_RUN_ID} --failed --repo ${GITHUB_REPOSITORY}. See https://github.com/brettdavies/.github/blob/main/README.md#cross-host-fallback"
            exit 1
          fi
          exit "$status"

      # rustc writes the deployment target into the binary, but a build
      # script's C compiler targets the runner's SDK unless
      # MACOSX_DEPLOYMENT_TARGET reaches it too. An object built for a newer
      # macOS links without a warning, and the binary then fails to load on
      # the older macOS the release claims. scripts/check-release-matrix-parity.sh
      # holds this step to the same text in both release workflows.
      - name: Check the macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ ! "$MACOSX_DEPLOYMENT_TARGET" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error title=macOS deployment target::macos_deployment_target is '${MACOSX_DEPLOYMENT_TARGET}'; expected a version such as 15.0"
            exit 1
          fi
          # True when version $1 is newer than version $2.
          newer() {
            awk -v a="$1" -v b="$2" 'BEGIN {
              n = split(a, x, "."); m = split(b, y, ".")
              for (i = 1; i <= 3; i++) {
                p = (i <= n) ? x[i] + 0 : 0; q = (i <= m) ? y[i] + 0 : 0
                if (p != q) exit !(p > q)
              }
              exit 1
            }'
          }
          dir="target/${TARGET}/release"
          {
            find "$dir" -maxdepth 1 -type f -perm -u+x
            # A build whose dependencies run no build script has no build/,
            # and a failed find would end the step under pipefail.
            [ ! -d "$dir/build" ] || find "$dir/build" -type f \( -name '*.a' -o -name '*.o' \)
          } 2>/dev/null | sort > macos-objects.txt
          # One line per object: its path and the macOS it declares, from
          # LC_BUILD_VERSION or, in older objects, LC_VERSION_MIN_MACOSX. An
          # archive lists each member as `archive.a(member.o)`.
          while IFS= read -r f; do otool -l "$f" 2>/dev/null || true; done < macos-objects.txt \
            | awk '
                /^[^[:space:]].*:$/ { object = substr($0, 1, length($0) - 1); command = ""; next }
                $1 == "cmd" { command = $2; next }
                (command == "LC_BUILD_VERSION" && $1 == "minos") || (command == "LC_VERSION_MIN_MACOSX" && $1 == "version") {
                  print object "\t" $2; command = ""
                }' > macos-minos.tsv
          if [ ! -s macos-minos.tsv ]; then
            echo "::error title=macOS deployment target::no Mach-O object under ${dir} declares a macOS version"
            exit 1
          fi
          echo "Objects by declared macOS version on ${TARGET} (deployment target ${MACOSX_DEPLOYMENT_TARGET}):"
          cut -f 2 macos-minos.tsv | sort | uniq -c
          find "$dir" -maxdepth 1 -type f -perm -u+x | while read -r binary; do
            awk -F '\t' -v b="$binary" '$1 == b { print b " declares macOS " $2 }' macos-minos.tsv
          done
          # Each file goes to the log rather than an annotation: a step shows
          # ten annotations, and the summary below carries the fix.
          bad=0
          first=""
          newest="$MACOSX_DEPLOYMENT_TARGET"
          while IFS=$'\t' read -r object minos; do
            if newer "$minos" "$MACOSX_DEPLOYMENT_TARGET"; then
              echo "${object} declares macOS ${minos}, newer than ${MACOSX_DEPLOYMENT_TARGET}, on ${TARGET}"
              bad=$((bad + 1))
              first="${first:-${object} (macOS ${minos})}"
              if newer "$minos" "$newest"; then newest="$minos"; fi
            fi
          done < macos-minos.tsv
          # The job already exports the variable, so a newer object comes from
          # a build step that ignores it, or from a prebuilt library: the fix
          # names both ways out.
          if [ "$bad" -gt 0 ]; then
            echo "::error title=macOS deployment target::${bad} object(s) on ${TARGET} declare a macOS newer than ${MACOSX_DEPLOYMENT_TARGET}, listed above in this step's log, the first ${first}. Nothing was published. To ship macOS ${newest} as the minimum, raise macos_deployment_target to ${newest}. To keep ${MACOSX_DEPLOYMENT_TARGET}, make the crate that built them read the variable: set MACOSX_DEPLOYMENT_TARGET for the whole build"
            exit 1
          fi

      # Soft-fail rows surface their failure as a job-summary warning so the
      # omitted artifact is loud in the run UI even though the release proceeds.
      # Skipped when the consumer opts into hard-fail (linux_musl_required: true).
      - name: Annotate soft-failed build
        if: failure() && matrix.soft_fail == true && !inputs.linux_musl_required
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          echo "::warning::${TARGET} build failed in soft-fail mode; artifact will be omitted from release"
          {
            echo "## ⚠️ \`${TARGET}\` build failed (soft-fail)"
            echo ""
            echo "This target is configured to fail open. The release will proceed without the \`${TARGET}\` artifact."
            echo ""
            echo "To make this target block the release, pass \`linux_musl_required: true\` from the caller's \`release.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Belt-and-suspenders Alpine exec validation — opt-in via
      # linux_musl_verify_alpine: true. x86_64 only; the static-link mechanism
      # is identical across arches, so one Alpine confirmation closes the
      # exec-compatibility question for both musl rows. Gated on success() so
      # the binary actually exists. Failure flows through the same soft/hard
      # path as the build itself (matrix.soft_fail + linux_musl_required).
      - name: Verify musl binary exec-compatible with Alpine
        if: success() && inputs.linux_musl_verify_alpine && matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ steps.binary.outputs.name }}
        run: |
          BIN_DIR="target/${TARGET}/release"
          # --pull always defeats any stale cached image. -v read-only so the
          # container can't write back. Direct exec of the binary (no shell
          # wrapping) so any dynamic-link surprise surfaces immediately.
          docker run --rm --pull always \
            -v "$PWD/$BIN_DIR:/musl-bin:ro" \
            alpine:latest \
            "/musl-bin/${BINARY}" --version

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ inputs.bin }}
        run: |
          codesign --force --sign - "target/${TARGET}/release/${BIN}"
          codesign --verify --verbose "target/${TARGET}/release/${BIN}"

      - name: Create archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ inputs.artifact_name || inputs.crate }}
          BINARY: ${{ steps.binary.outputs.name }}
        run: |
          STAGING="${ARTIFACT}-${TARGET}"
          mkdir -p "$STAGING"
          cp "target/${TARGET}/release/${BINARY}" "$STAGING/"
          cp LICENSE-MIT LICENSE-APACHE README.md "$STAGING/"
          cp -r completions "$STAGING/"
          if [[ "$TARGET" == *windows* ]]; then
            7z a "${STAGING}.zip" "$STAGING"
          else
            tar czf "${STAGING}.tar.gz" "$STAGING"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name || inputs.crate }}-${{ matrix.target }}
          path: ${{ inputs.artifact_name || inputs.crate }}-${{ matrix.target }}.*

  # The attestation leg is three jobs that run only when the caller sets
  # `attest`: `sbom` and `attest` here, and `verify-attestations` after the
  # release. They are separate so the job that signs runs no code from the
  # repository or from crates.io. `sbom` runs cargo tooling and holds a
  # read-only token; `attest` holds the signing permissions and runs only
  # GitHub's own actions over files other jobs produced.
  sbom:
    needs: validate-inputs
    if: ${{ inputs.attest }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx@0.5.9 --locked

      # `--describe binaries` writes `<bin>_bin.cdx.json` beside the manifest
      # of each binary crate and leaves dev-dependencies out, so the SBOM lists
      # what is compiled into the binary. `--target all` covers every archive's
      # platform in the one document.
      - name: Generate the CycloneDX SBOM
        env:
          CRATE: ${{ inputs.crate }}
          BIN: ${{ inputs.bin }}
        run: |
          MANIFEST=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg crate "$CRATE" '.packages[] | select(.name == $crate) | .manifest_path')
          if [ -z "$MANIFEST" ]; then
            echo "::error::No package named ${CRATE} in the workspace"
            exit 1
          fi
          cargo cyclonedx --manifest-path "$MANIFEST" --format json --spec-version 1.5 \
            --target all --describe binaries
          SBOM="$(dirname "$MANIFEST")/${BIN}_bin.cdx.json"
          if [ ! -f "$SBOM" ]; then
            echo "::error::cargo-cyclonedx wrote no SBOM at ${SBOM}"
            exit 1
          fi
          mkdir sbom
          cp "$SBOM" "sbom/${BIN}.cdx.json"

      # Named so the release job's `<artifact>-*` glob over the downloaded
      # artifacts does not match it.
      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ inputs.artifact_name || inputs.crate }}
          path: sbom/*.cdx.json
          if-no-files-found: error

  # Signs what the build jobs uploaded, before publish-crate, so a failed
  # attestation publishes nothing.
  #
  # The job names no `permissions:` on purpose. GitHub checks every
  # permission a called workflow's jobs name against the caller's grant when
  # the run starts, whether or not the job then runs: a caller that leaves
  # `attest` off and grants no `attestations: write` fails at startup if a
  # job here names it. The job takes the caller's grant instead, and a
  # caller that turns `attest` on grants it.
  attest:
    needs: [build, sbom, check-version, audit]
    if: ${{ inputs.attest }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download the build's artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # The same shell as the release job's "Prepare release assets and
      # checksums", so the two sets are the same bytes; `verify-attestations`
      # fails the run if they ever are not.
      - name: Assemble the release set
        env:
          ARTIFACT: ${{ inputs.artifact_name || inputs.crate }}
        run: |
          mkdir -p release
          for dir in "artifacts/${ARTIFACT}-"*; do
            [ ! -d "$dir" ] && continue
            cp "$dir"/*.tar.gz "$dir"/*.zip release/ 2>/dev/null || true
          done
          cd release
          if [ -z "$(ls -A)" ]; then
            echo "::error::No release artifacts found"
            exit 1
          fi
          sha256sum ./* > sha256sum.txt
          ls -la

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
          sbom-path: artifacts/sbom-${{ inputs.artifact_name || inputs.crate }}/${{ inputs.bin }}.cdx.json

  # `sbom` and `attest` are skipped for a caller that leaves the input off,
  # and a job whose ancestor was skipped is itself skipped unless its `if`
  # names a status function. So this job and the two below state what they
  # wait for: each runs when the jobs it needs succeeded. A skipped
  # attestation job is nothing to wait for only when the input is off: with
  # it on, `attest` is also skipped when a gate or `sbom` fails, and that must
  # publish nothing. The advisories audit's `continue-on-error` leaves `audit`
  # a success when only advisories fail.
  publish-crate:
    needs: [build, sbom, check-version, audit, attest]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.check-version.result == 'success' && needs.audit.result == 'success' && ((inputs.attest && needs.sbom.result == 'success' && needs.attest.result == 'success') || (!inputs.attest && needs.sbom.result == 'skipped' && needs.attest.result == 'skipped')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # `cargo publish -p <crate>` resolves a path dependency from the
      # registry, so a workspace member the crate depends on must be on
      # crates.io at a version its bound accepts. A library tag pushed beside
      # this one publishes while this run builds, so the step waits for it
      # rather than failing; a scratch manifest asks cargo the exact question
      # the publish will ask. It runs before the token exchange, whose token
      # would otherwise age through the wait.
      - name: Wait for workspace dependencies on crates.io
        env:
          CRATE: ${{ inputs.crate }}
          WAIT_SECONDS: 600
          DOCS: https://github.com/brettdavies/.github/blob/main/README.md
        run: |
          set -euo pipefail
          deps=$(cargo metadata --format-version 1 --no-deps \
            | jq -r --arg crate "$CRATE" '.packages[] | select(.name == $crate) | .dependencies[] | select(.path != null and (.kind == null or .kind == "build")) | "\(.name)\t\(.req)"')
          if [ -z "$deps" ]; then
            echo "${CRATE} depends on no workspace member; nothing to wait for."
            exit 0
          fi
          probes="$(mktemp -d)"
          while IFS=$'\t' read -r name req; do
            mkdir -p "$probes/$name/src"
            : > "$probes/$name/src/lib.rs"
            printf '[package]\nname = "bound-probe"\nversion = "0.0.0"\nedition = "2021"\n\n[dependencies]\n%s = "%s"\n' "$name" "$req" > "$probes/$name/Cargo.toml"
          done <<<"$deps"
          deadline=$((SECONDS + WAIT_SECONDS))
          next_log=$SECONDS
          while :; do
            missing=""
            while IFS=$'\t' read -r name req; do
              if ! cargo generate-lockfile --manifest-path "$probes/$name/Cargo.toml" --quiet 2>/dev/null; then
                missing="${missing} ${name}@${req}"
              fi
            done <<<"$deps"
            if [ -z "$missing" ]; then
              echo "Every workspace member ${CRATE} depends on is on crates.io at its bound, after ${SECONDS}s."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=library-wait-timeout::${CRATE} depends on${missing}, still not on crates.io at that bound after ${WAIT_SECONDS}s. Nothing was published. Once the library's release run is green, continue this release with: gh run rerun ${GITHUB_RUN_ID} --failed --repo ${GITHUB_REPOSITORY}. See ${DOCS}#library-wait-timeout"
              exit 1
            fi
            if [ "$SECONDS" -ge "$next_log" ]; then
              echo "Waiting for${missing} on crates.io (${SECONDS}s of ${WAIT_SECONDS}s)"
              next_log=$((SECONDS + 60))
            fi
            sleep 10
          done

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # `-p` names the package: a bare `cargo publish` errors on a workspace
      # root that is a virtual manifest, and a workspace's library member ships
      # through rust-lib-release.yml on its own tag. `--no-verify` skips the
      # compile of the packaged crate: a caller runs `cargo publish --dry-run`
      # in the pull-request gate the tagged tree merged through, so the job
      # keeps no dependency cache either.
      - name: Publish to crates.io
        env:
          CRATE: ${{ inputs.crate }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish -p "$CRATE" --no-verify

  release:
    needs: [validate-inputs, build, publish-crate]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.publish-crate.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release notes from the changelog
        id: changelog
        env:
          CHANGELOG_INPUT: ${{ inputs.changelog }}
          TAG: ${{ needs.validate-inputs.outputs.tag }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          # A single-crate repository keeps its changelog at the root, which is
          # the default. A workspace whose member keeps its own beside its
          # manifest passes that path: the root holds no changelog to read, and
          # the release would otherwise ship generated notes on a warning.
          CHANGELOG="${CHANGELOG_INPUT:-CHANGELOG.md}"
          if [ ! -f "$CHANGELOG" ]; then
            echo "::error::No changelog at ${CHANGELOG}"
            exit 1
          fi
          # Anchor on the section whose '## ' heading contains the tag's version,
          # not blindly the first section: a tag cut before its changelog entry
          # landed, or an '## [Unreleased]' block at the top, would otherwise
          # ship the wrong section silently. check-version has already verified
          # the tag matches the crate version.
          NOTES=$(awk -v ver="$VERSION" '/^## /{if(f)exit; if(index($0,ver))f=1} f' "$CHANGELOG")
          if [ -z "$NOTES" ]; then
            echo "::warning::No ${CHANGELOG} section for ${TAG}; falling back to generated notes"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "content<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Prepare release assets and checksums
        env:
          ARTIFACT: ${{ inputs.artifact_name || inputs.crate }}
        run: |
          mkdir -p release
          for dir in "artifacts/${ARTIFACT}-"*; do
            [ ! -d "$dir" ] && continue
            cp "$dir"/*.tar.gz "$dir"/*.zip release/ 2>/dev/null || true
          done
          cd release
          if [ -z "$(ls -A)" ]; then
            echo "::error::No release artifacts found"
            exit 1
          fi
          sha256sum ./* > sha256sum.txt
          ls -la

      # Published, never a draft: `brew pr-pull` finds the release through
      # GET /repos/{owner}/{repo}/releases/tags/{tag}, which returns no drafts,
      # and on that 404 creates a second release for the same tag. make_latest
      # stays false until the tap publishes the formula and dispatches
      # rust-finalize-release.yml. For a source-built formula that waits for
      # the bottles to upload, so the repository's latest release always has
      # them; a prebuilt formula installs this release's archives and has none.
      # `tag_name` is set because the action otherwise takes the run's ref,
      # which names the branch in a dispatched run.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.validate-inputs.outputs.tag }}
          files: release/*
          body: ${{ steps.changelog.outputs.content }}
          generate_release_notes: ${{ steps.changelog.outputs.generate == 'true' }}
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Downloads what the release published and checks each file against the
  # attestations `attest` made, with the command a user is told to run. A
  # file that was changed after it was signed, or a release set that drifted
  # from the attested one, fails here and the Homebrew dispatch does not go
  # out. Like `attest`, the job names no `permissions:` and takes the
  # caller's grant.
  verify-attestations:
    needs: [validate-inputs, release]
    if: ${{ inputs.attest }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.validate-inputs.outputs.tag }}
      # This file. `github.workflow_ref` names the caller inside a called
      # workflow, so the signer is spelled out.
      SIGNER: brettdavies/.github/.github/workflows/rust-release.yml
    steps:
      # Fetched by the names the release's own checksum file lists. Assets
      # added to the release later (a source-built formula's Homebrew bottles)
      # are not in that file, so a re-run checks the same set as the first run.
      - name: Download the published archives
        run: |
          mkdir release
          cd release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern sha256sum.txt
          awk '{ sub(/^\.\//, "", $2); print $2 }' sha256sum.txt | while read -r asset; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset"
          done
          sha256sum --check sha256sum.txt

      # Every check runs at once and the step waits for all of them, so it
      # takes about as long as the slowest one. Each check logs to its own
      # file, printed whole when it fails, so the output of concurrent calls
      # never interleaves.
      - name: Verify build provenance and the SBOM attestation
        working-directory: release
        run: |
          set -uo pipefail
          logs="$RUNNER_TEMP/attestation-verify"
          mkdir -p "$logs"
          checks=()
          pids=()
          for file in *; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" \
              > "$logs/$file.provenance.log" 2>&1 &
            checks+=("$file|build provenance|$logs/$file.provenance.log")
            pids+=("$!")
          done
          for file in *.tar.gz *.zip; do
            [ -e "$file" ] || continue
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER" \
              --predicate-type https://cyclonedx.org/bom > "$logs/$file.sbom.log" 2>&1 &
            checks+=("$file|SBOM|$logs/$file.sbom.log")
            pids+=("$!")
          done
          failed=0
          for i in "${!pids[@]}"; do
            IFS='|' read -r file kind log <<<"${checks[$i]}"
            if wait "${pids[$i]}"; then
              echo "verified: ${file} (${kind})"
            else
              failed=$((failed + 1))
              echo "::group::${file} (${kind}) did not verify"
              cat "$log"
              echo "::endgroup::"
              echo "::error::${file} did not verify against its ${kind} attestation; the Homebrew dispatch does not go out"
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "${failed} of ${#pids[@]} attestation checks failed"
            exit 1
          fi
          echo "All ${#pids[@]} attestation checks passed"

  homebrew:
    needs: [validate-inputs, release, verify-attestations]
    if: ${{ !cancelled() && needs.release.result == 'success' && (needs.verify-attestations.result == 'success' || (!inputs.attest && needs.verify-attestations.result == 'skipped')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Dispatch Homebrew formula update
        env:
          GH_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
          CRATE: ${{ inputs.crate }}
          REPO: ${{ github.repository }}
        run: |
          gh api repos/brettdavies/homebrew-tap/dispatches \
            --method POST \
            -f event_type=update-formula \
            -f "client_payload[formula]=${CRATE}" \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[repo]=${REPO}"
