# Reusable workflow that deletes a closed pull request's Actions caches.
#
# A pull request's caches live under refs/pull/<n>/merge, which only that pull
# request's runs can read, so closing it leaves them unreachable. They still
# count against the repository's 10 GB limit, and GitHub evicts the least
# recently used entries first, so a closed pull request's recent entries outlast
# the warm entries under dev and main that every new pull request restores from.
#
# Caller example:
#   on:
#     pull_request:
#       types: [closed]
#   permissions: {}
#   jobs:
#     cleanup:
#       permissions:
#         actions: write
#       uses: brettdavies/.github/.github/workflows/pr-cache-cleanup.yml@main
#
# Required caller permissions: actions: write
name: PR cache cleanup

on:
  workflow_call:

# A literal token leads the group key. Inside a called workflow
# `github.workflow` resolves to the *caller's* workflow name, so a key built
# only from context is one a caller also produces for its own group; both then
# land in one group and this workflow's queue cancels the run that called it.
# The caller part stays so callers separate. The last part is the pull
# request's number, not the ref, so the group is one pull request's whatever
# ref its closed event runs on: two pull requests merged moments apart each run
# their delete, and one closed, reopened, and closed again runs one.
concurrency:
  group: pr-cache-cleanup-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  cleanup:
    name: Delete caches
    # A fork's pull request gets a read-only token, so the delete could only
    # fail; its entries leave by eviction. Outside a pull_request event the
    # payload has no pull request, so the job skips.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # `--ref` scopes `--all` to this pull request's entries, and
      # `--succeed-on-no-caches` passes a pull request that matched every warm
      # key and so saved nothing.
      - name: Delete this pull request's caches
        run: gh cache delete --all --ref "$PR_REF" --succeed-on-no-caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
