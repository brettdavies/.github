# Reusable CI workflow for brettdavies Rust CLI tools.
# Runs formatting, linting, tests, security audit, and package check. Tests on
# Windows and macOS, a doc build, an MSRV check, completions freshness, output
# discipline, and workflow concurrency run when the caller turns each on; the
# last three run scripts from the caller's checkout, because the rule each
# enforces is the repository's own.
#
# Three inputs shape a run rather than add a check: `jobs` names the jobs to
# run, `warm_cache` builds what each check compiles and saves the caches a pull
# request restores, and `test_runner: nextest` runs `Fmt, clippy` and `Tests`
# in place of `Fmt, clippy, test`.
#
# Caller example:
#   jobs:
#     ci:
#       uses: brettdavies/.github/.github/workflows/rust-ci.yml@main
#       with:
#         cross_os_tests: true
#         docs: true
#         msrv: true
#         completions: true          # scripts/generate-completions.sh --check
#         lint_stdio: true           # scripts/lint-stdio.sh
#         workflow_concurrency: true # scripts/check-workflow-concurrency.sh
#
# Required caller permissions: contents: read, pull-requests: read
#
# A caller that declares its own `concurrency:` block covers only the jobs it
# defines itself; this workflow's jobs are covered by the group below. Key the
# caller's group on its own literal token (`ci-${{ github.ref }}`), never on
# `${{ github.workflow }}` alone: see the note on that block for what happens
# when the two keys match.
name: Rust CI

on:
  workflow_call:
    inputs:
      advisories_blocking:
        description: "Fail the run when `cargo deny check advisories` reports a finding. Default false: the advisories row soft-fails so a newly published advisory against an unrelated dependency cannot block every consumer's merges. Set true once the consumer repo is willing to treat an advisory as a stop condition."
        type: boolean
        required: false
        default: false
      audit_ref:
        description: "The ref the `Security audit` job checks out. Default empty: the commit the run is for, as every other job checks out. A scheduled run starts on the default branch, so a repository that releases from another branch names that branch here to audit the lockfile its next release ships."
        type: string
        required: false
        default: ""
      windows_nasm:
        description: "Install NASM on the Windows jobs before cargo runs. Default false. Set true when a dependency assembles on x86-64 Windows (aws-lc-sys, behind rustls's aws-lc-rs provider, does), because neither hosted Windows image ships NASM; cmake, its other build requirement, is preinstalled on every hosted image."
        type: boolean
        required: false
        default: false
      docs_only:
        description: "Skip every job. Default false. A caller sets it once it has established that nothing in the change can reach cargo, such as a pull request that edits only documentation no Rust source reads. A job skipped by its condition reports success, which a ruleset counts as passing, so required checks stay satisfied. The audit and test matrices skip their steps rather than themselves: a matrix job skipped whole never expands, and its cells' checks would wait forever under their expanded names."
        type: boolean
        required: false
        default: false
      jobs:
        description: "The jobs to run: `all` (default), or a JSON array of job ids, such as `[\"check\",\"docs\"]`, where `[]` runs none. A job runs only when its own input turns it on, `docs_only` is false, and this names it. The ids are the keys under `jobs:` in this file. An id the workflow does not have fails the `Inputs` job, because the job it meant would skip, and a skipped required check reports success."
        type: string
        required: false
        default: all
      warm_cache:
        description: "Build what each check compiles without running the check, and save each job's cache only when the job succeeds. Default false. Tests build with `--no-run`, clippy's step runs `cargo check` with the same flags, a check that only compiles runs as it is, and jobs that keep no Rust cache skip. A caller passes it on push, so a pull request restores caches built by the same jobs, inputs, and environment. Call it from a caller job of its own, such as `warm:`, so its checks report as `warm / <job>` and never under a required `ci / <job>` name; rust-cache keys on this workflow's job ids, not the caller's, so the caches still match."
        type: boolean
        required: false
        default: false
      test_runner:
        description: "`cargo` (default) runs `cargo test` inside `Fmt, clippy, test`. `nextest` runs `Fmt, clippy` (job id `fmt-clippy`) and `Tests` (job id `tests`) in its place; `Tests` runs `cargo nextest run --profile ci` and then `cargo test --doc`, and the caller's `.config/nextest.toml` defines the `ci` profile."
        type: string
        required: false
        default: cargo
      nextest_version:
        description: "The exact cargo-nextest release `Tests` installs, such as `0.9.150`. Required with `test_runner: nextest`."
        type: string
        required: false
        default: ""
      test_partitions:
        description: "With `test_runner: nextest`, run `Tests` as this many `--partition hash:k/N` jobs, 1 (default) to 4, each named `Tests (k/N)`. Each partition builds the test binaries itself, so a split pays only when running the tests outweighs a second build. The first partition also runs the doc tests."
        type: number
        required: false
        default: 1
      anc_debug_audit:
        description: "With `test_runner: nextest` and `anc_version`, `Tests` also builds the debug `anc_bin` and audits it against `anc_score_floor` and `anc_blocking_tiers`. Default false. The release build and its size ceiling stay in `Agent-native audit`."
        type: boolean
        required: false
        default: false
      toolchain:
        description: "The toolchain each job installs and makes rustup's default. Default `stable`. A rust-toolchain.toml or rust-toolchain file in the caller's repository outranks it: rustup installs the toolchain the file names, with the file's components."
        type: string
        required: false
        default: stable
      cross_os_tests:
        description: "Run the `Windows test` and `macOS test` jobs: the `cargo test` that `Fmt, clippy, test` runs on Linux, on `windows-latest` and `macos-latest`. `Windows check` only compiles, so a path, file mode, rename, or lock that behaves differently off Linux passes it and fails here. Default false."
        type: boolean
        required: false
        default: false
      docs:
        description: "Run the `Doc build` job: `cargo doc --workspace --no-deps --locked` with `RUSTDOCFLAGS=-D warnings`, so a broken intra-doc link or code fence fails the PR instead of the docs.rs build after publish. Default false."
        type: boolean
        required: false
        default: false
      msrv:
        description: "Run the `MSRV` job: `cargo +<rust-version> check --workspace --all-features --locked` on the `rust-version` the root Cargo.toml declares. Every other job compiles on the rust-toolchain.toml pin, which is usually newer, so this is the only job that sees a change that breaks a consumer still on the declared version. Default false."
        type: boolean
        required: false
        default: false
      completions:
        description: "Run the `Completions freshness` job: `scripts/generate-completions.sh --check` from the caller's checkout, which fails when completions/ no longer matches the clap definition. Default false."
        type: boolean
        required: false
        default: false
      lint_stdio:
        description: "Run the `Output discipline` job: `scripts/lint-stdio.sh` from the caller's checkout, with ripgrep installed. The script holds the repository's own rule for where output may be written. Default false."
        type: boolean
        required: false
        default: false
      workflow_concurrency:
        description: "Run the `Workflow concurrency` job: `scripts/check-workflow-concurrency.sh`, vendored from github-repo-setup, which fails a concurrency group that leads with an expression rather than a literal token. Default false."
        type: boolean
        required: false
        default: false
      anc_version:
        description: "Run the `Agent-native audit` job with this exact anc release (for example `0.6.0`). Default empty: no audit. The pin is the gate's only way to meet a new anc release, so a release that adds or rescores rows reaches the caller through a PR that bumps it."
        type: string
        required: false
        default: ""
      anc_bin:
        description: "The binary target the audit builds in release mode and grades, with the source tree, as `anc audit . --bin <name>`. Required when `anc_version` is set."
        type: string
        required: false
        default: ""
      anc_score_floor:
        description: "Fail the audit when the scorecard's credit-weighted `badge.score_pct` is below this. Default 0. Warnings never fail on their own, so the floor is what catches a row that slips from pass to warn."
        type: number
        required: false
        default: 0
      anc_blocking_tiers:
        description: "Which `fail` and `error` rows fail the audit: `must` (default) counts only MUST-tier rows, `any` counts every row, including source rows that carry no tier."
        type: string
        required: false
        default: "must"
      release_size_ceiling_bytes:
        description: "With `anc_version` set, fail when the release binary is larger than this many bytes. Default 0: no ceiling. Cargo honors [profile.release] only from the workspace root, and a profile that stops applying inflates the binary while every test stays green."
        type: number
        required: false
        default: 0

# The literal `rust-ci-` prefix is what keeps this group distinct from a
# caller's own. Inside a called workflow `github.workflow` is the *caller's*
# workflow name, so a key built only from context is a key the caller also
# produces: both land in one group, and because this block cancels in progress,
# this workflow's queue cancels the run that called it. That presents as a run
# concluding failure with every visible job green and this workflow's jobs
# absent, with nothing in the logs naming a cause. The caller and ref parts stay
# so two consumers, and two branches of one consumer, still separate. The
# warm_cache part lets one run call this workflow twice, once to warm caches
# and once to check, without either call cancelling the other.
concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.warm_cache }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # Crate downloads on hosted runners, Linux and Windows alike, fail with
  # curl error 16 ("Error in the HTTP2 framing layer"), which cargo does not
  # retry; HTTP/1.1 avoids it.
  CARGO_HTTP_MULTIPLEXING: "false"
  # Line tables keep file and line in a failing test's backtrace while cutting a
  # cold build by about a third and the target directory by about half against
  # full debug info (measured on xurl-rs, Linux and Windows). Release builds are
  # unaffected. Incremental artifacts only add weight to a cached CI build. A
  # caller's own workflow `env` never reaches these jobs, so the setting lives
  # here; `line-tables-only` needs Rust 1.71 or later.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Each job's condition ends in `contains(fromJSON(inputs.jobs), '<its id>')`,
# and `validate-inputs` holds the ids in KNOWN_JOBS;
# scripts/check-rust-ci-jobs.sh fails when the two disagree.
#
# Swatinem/rust-cache keys each cache on the job id and on every CARGO*, RUST*,
# CC*, CFLAGS*, CXX*, and CMAKE* variable in the job's environment. A warm run
# matches a pull request's keys only while job ids and those variables stay the
# same in both modes, so mode-specific values live in step `env` or in names
# outside those prefixes.
jobs:
  # Runs only when a caller sets an input it checks, which no default does.
  validate-inputs:
    name: Inputs
    if: inputs.jobs != 'all' || inputs.test_runner != 'cargo' || inputs.test_partitions != 1 || inputs.anc_debug_audit
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      KNOWN_JOBS: '["check","fmt-clippy","check-windows","audit","package-check","shellcheck","test-windows","test-macos","docs","msrv","completions","lint-stdio","workflow-concurrency","anc","tests","changelog-check"]'
      JOBS: ${{ inputs.jobs }}
      TEST_RUNNER: ${{ inputs.test_runner }}
      NEXTEST_VERSION: ${{ inputs.nextest_version }}
      TEST_PARTITIONS: ${{ inputs.test_partitions }}
      ANC_DEBUG_AUDIT: ${{ inputs.anc_debug_audit }}
      ANC_VERSION: ${{ inputs.anc_version }}
      ANC_BIN: ${{ inputs.anc_bin }}
    steps:
      - name: Check the inputs
        run: |
          set -euo pipefail
          status=0
          fail() {
            echo "::error title=rust-ci inputs::$1"
            status=1
          }
          if [ "$JOBS" != all ]; then
            if ! jq -e 'type == "array" and all(.[]; type == "string")' <<<"$JOBS" > /dev/null 2>&1; then
              fail "jobs is '${JOBS}'; expected all or a JSON array of job ids, such as [\"check\",\"docs\"]"
            else
              unknown="$(jq -r --argjson known "$KNOWN_JOBS" '[.[] | select(. as $id | $known | index($id) | not)] | unique | join(", ")' <<<"$JOBS")"
              if [ -n "$unknown" ]; then
                fail "jobs names ${unknown}, which this workflow does not have; its job ids are $(jq -r 'join(", ")' <<<"$KNOWN_JOBS")"
              fi
            fi
          fi
          case "$TEST_RUNNER" in
            cargo | nextest) ;;
            *) fail "test_runner is '${TEST_RUNNER}'; expected cargo or nextest" ;;
          esac
          if [ "$TEST_RUNNER" = nextest ] && [[ ! "$NEXTEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            fail "test_runner is nextest, so nextest_version must name an exact release such as 0.9.150; it is '${NEXTEST_VERSION}'"
          fi
          case "$TEST_PARTITIONS" in
            1) ;;
            2 | 3 | 4)
              if [ "$TEST_RUNNER" != nextest ]; then
                fail "test_partitions is ${TEST_PARTITIONS}, but only the nextest Tests job splits; set test_runner: nextest or leave test_partitions at 1"
              fi
              ;;
            *) fail "test_partitions is '${TEST_PARTITIONS}'; expected 1 to 4" ;;
          esac
          if [ "$ANC_DEBUG_AUDIT" = true ]; then
            if [ "$TEST_RUNNER" != nextest ]; then
              fail "anc_debug_audit runs in the nextest Tests job; set test_runner: nextest"
            fi
            if [ -z "$ANC_VERSION" ] || [ -z "$ANC_BIN" ]; then
              fail "anc_debug_audit needs anc_version and anc_bin"
            fi
          fi
          exit "$status"

  # Job names stay literal: GitHub reports a skipped job under its raw `name:`
  # text, so a name built from an expression would rename every skipped check,
  # and a required one would never report under the name a ruleset expects.
  check:
    name: Fmt, clippy, test
    if: ${{ inputs.test_runner != 'nextest' && !inputs.docs_only && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'check')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TOOLCHAIN_COMPONENTS: rustfmt,clippy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Shared by every job that builds. RUN_STEPS is set only in the matrix
      # jobs, which skip their steps rather than themselves.
      - &install-rust
        name: Install Rust
        if: env.RUN_STEPS != 'false'
        shell: bash
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        # rustup applies a rust-toolchain file over its default toolchain, so
        # where the caller has one, the file's toolchain is the one installed.
        run: |
          set -euo pipefail
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then
            rustup toolchain install --no-self-update
          else
            rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
            rustup default "$TOOLCHAIN"
          fi
          if [ -n "${TOOLCHAIN_COMPONENTS:-}" ]; then
            IFS=, read -ra components <<<"$TOOLCHAIN_COMPONENTS"
            rustup component add "${components[@]}"
          fi
          rustc --version --verbose

      # A warm run saves only on success, so a run that fails partway leaves no
      # partial entry under the exact key, which no later run would refill.
      - &rust-cache
        name: Cache dependencies
        if: env.RUN_STEPS != 'false'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: ${{ !inputs.warm_cache }}

      - &check-formatting
        name: Check formatting
        if: ${{ !inputs.warm_cache }}
        run: cargo fmt --all --check

      # Warm mode swaps the subcommand and keeps the flags, so the cache holds
      # what clippy compiles.
      - &clippy
        name: Clippy
        run: cargo ${{ inputs.warm_cache && 'check' || 'clippy' }} --all-targets

      - name: Tests
        run: cargo test${{ inputs.warm_cache && ' --no-run' || '' }}

  # `check` without its tests, which `tests` runs under nextest. Its own job id
  # keeps its cache apart from the test build's.
  fmt-clippy:
    name: Fmt, clippy
    if: ${{ inputs.test_runner == 'nextest' && !inputs.docs_only && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'fmt-clippy')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      TOOLCHAIN_COMPONENTS: rustfmt,clippy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *install-rust

      - *rust-cache

      - *check-formatting

      - *clippy

  check-windows:
    name: Windows check
    if: ${{ !inputs.docs_only && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'check-windows')) }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *install-rust

      - *rust-cache

      # `cargo check` still runs build scripts, so a C library in the tree is
      # compiled here. choco rather than a marketplace action: the shared
      # workflow gains no new pinned dependency. The package installs under
      # Program Files without touching the step's PATH, so the directory is
      # appended explicitly.
      - name: Install NASM
        if: inputs.windows_nasm && runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress --yes
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\NASM'

      # Compiling is the whole check, so warm mode runs it as it is.
      - name: Check (Windows)
        run: cargo check --all-targets

  audit:
    name: Security audit
    # The audit keeps no Rust cache, so a warm run has nothing for it to build.
    if: ${{ !inputs.warm_cache }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        checks: [advisories, "bans licenses sources"]
    # The advisories row soft-fails by default because its input is the
    # RustSec database, not the repo: an advisory published overnight against a
    # transitive dependency would otherwise turn every consumer's CI red with no
    # change on their side. The job's own conclusion is still `failure`, so a
    # consumer can require the check in its ruleset to gate merges without
    # opting into a red run. `advisories_blocking: true` additionally fails the
    # run itself.
    continue-on-error: ${{ matrix.checks == 'advisories' && !inputs.advisories_blocking }}
    env:
      RUN_STEPS: ${{ !inputs.docs_only && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'audit')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_STEPS == 'true'
        with:
          ref: ${{ inputs.audit_ref }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        if: env.RUN_STEPS == 'true'
        with:
          command: check ${{ matrix.checks }}

  package-check:
    name: Package check
    if: ${{ !inputs.docs_only && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'package-check')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *install-rust

      - *rust-cache

      # `--workspace` packages every member together and verifies them against
      # each other, which is the only way to dry-run a member whose path
      # dependency is not on crates.io yet. On a single root package it is the
      # same command as before.
      - name: List package contents
        if: ${{ !inputs.warm_cache }}
        run: cargo package --list --workspace

      # The dry run compiles each package and executes nothing, so warm mode
      # runs it as it is.
      - name: Dry-run publish
        run: cargo publish --dry-run --workspace

  shellcheck:
    name: Shellcheck
    if: ${{ !inputs.docs_only && !inputs.warm_cache && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'shellcheck')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Run shellcheck
        run: |
          mapfile -t shell_files < <({
            git ls-files '*.sh' 2>/dev/null
            git ls-files 'scripts/hooks/*' 2>/dev/null
          } | sort -u)
          if [ ${#shell_files[@]} -eq 0 ]; then
            echo "No tracked shell scripts found. Skipping."
            exit 0
          fi
          printf 'Linting %d file(s):\n' "${#shell_files[@]}"
          printf '  %s\n' "${shell_files[@]}"
          shellcheck --severity=warning "${shell_files[@]}"

  # Each job from here to `changelog-check` runs only when its caller turns it
  # on. One that is off reports skipped, which a ruleset counts as passing, so
  # a consumer that sets none of these inputs keeps the verdicts it has.
  #
  # Two jobs rather than a matrix: a matrix job skipped by `docs_only` never
  # expands, so a ruleset requiring the per-OS check would wait on it forever.
  test-windows:
    name: Windows test
    if: ${{ inputs.cross_os_tests && !inputs.docs_only && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'test-windows')) }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *install-rust

      - *rust-cache

      - name: Install NASM
        if: inputs.windows_nasm
        shell: pwsh
        run: |
          choco install nasm --no-progress --yes
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\NASM'

      - name: Tests (Windows)
        run: cargo test${{ inputs.warm_cache && ' --no-run' || '' }}

  test-macos:
    name: macOS test
    if: ${{ inputs.cross_os_tests && !inputs.docs_only && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'test-macos')) }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *install-rust

      - *rust-cache

      - name: Tests (macOS)
        run: cargo test${{ inputs.warm_cache && ' --no-run' || '' }}

  docs:
    name: Doc build
    if: ${{ inputs.docs && !inputs.docs_only && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'docs')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *install-rust

      - *rust-cache

      # Documenting is a build, so warm mode runs it as it is.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  msrv:
    name: MSRV
    if: ${{ inputs.msrv && !inputs.docs_only && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'msrv')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *install-rust

      - name: Install the declared rust-version
        id: msrv
        run: |
          set -euo pipefail
          msrv="$(awk -F\" '/^rust-version *= *"/ {print $2; exit}' Cargo.toml)"
          if [ -z "$msrv" ]; then
            echo "::error title=MSRV::the root Cargo.toml declares no rust-version"
            exit 1
          fi
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
          cache-on-failure: ${{ !inputs.warm_cache }}

      # A compile check, not a lint pass: an older compiler can warn where
      # the pinned one does not, and the clippy job already denies warnings.
      # Compiling is the whole check, so warm mode runs it as it is.
      - name: cargo check on the declared rust-version
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
          RUSTFLAGS: ""
        run: cargo "+${MSRV}" check --workspace --all-features --locked

  completions:
    name: Completions freshness
    if: ${{ inputs.completions && !inputs.docs_only && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'completions')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find scripts/generate-completions.sh
        run: |
          if [ ! -f scripts/generate-completions.sh ]; then
            echo "::error title=Completions freshness::scripts/generate-completions.sh is not in this repository. Add a script whose --check exits non-zero when completions/ no longer matches the CLI, or stop passing completions: true."
            exit 1
          fi

      - *install-rust

      - *rust-cache

      # The caller's script owns the build it runs, so warm mode runs the
      # script: its build is what the cache needs, and the comparison after it
      # costs seconds.
      - name: Verify completions match the CLI definition
        run: bash scripts/generate-completions.sh --check

  lint-stdio:
    name: Output discipline
    if: ${{ inputs.lint_stdio && !inputs.docs_only && !inputs.warm_cache && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'lint-stdio')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find scripts/lint-stdio.sh
        run: |
          if [ ! -f scripts/lint-stdio.sh ]; then
            echo "::error title=Output discipline::scripts/lint-stdio.sh is not in this repository. Add the script that holds the repository's rule for where output may be written, or stop passing lint_stdio: true."
            exit 1
          fi

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run scripts/lint-stdio.sh
        run: bash scripts/lint-stdio.sh

  workflow-concurrency:
    name: Workflow concurrency
    if: ${{ inputs.workflow_concurrency && !inputs.docs_only && !inputs.warm_cache && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'workflow-concurrency')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check concurrency group namespacing
        run: |
          if [ ! -f scripts/check-workflow-concurrency.sh ]; then
            echo "::error title=Workflow concurrency::scripts/check-workflow-concurrency.sh is not in this repository. Vendor it from the github-repo-setup skill's templates/check-workflow-concurrency.sh, or stop passing workflow_concurrency: true."
            exit 1
          fi
          bash scripts/check-workflow-concurrency.sh

  # The audit grades the source tree and the release binary together, so the
  # source rows (`code-unwrap` and its kin) count beside the behavioral ones.
  # Warm mode builds the release binary and skips the audit. `Tests` shares
  # the install, audit, and upload steps through RUN_AUDIT and ANC_SCORECARD.
  anc:
    name: Agent-native audit
    if: ${{ inputs.anc_version != '' && !inputs.docs_only && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'anc')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANC_VERSION: ${{ inputs.anc_version }}
      ANC_BIN: ${{ inputs.anc_bin }}
      ANC_SCORE_FLOOR: ${{ inputs.anc_score_floor }}
      ANC_BLOCKING_TIERS: ${{ inputs.anc_blocking_tiers }}
      ANC_SCORECARD: anc-scorecard
      RUN_AUDIT: ${{ !inputs.warm_cache }}
      SIZE_CEILING_BYTES: ${{ inputs.release_size_ceiling_bytes }}
    steps:
      - name: Check the inputs
        run: |
          if [ -z "$ANC_BIN" ]; then
            echo "::error title=anc audit::anc_version is set, so anc_bin must name the binary to audit"
            exit 1
          fi
          if [[ ! "$ANC_BIN" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error title=anc audit::anc_bin '${ANC_BIN}' is not a binary name; expected letters, digits, _ and -"
            exit 1
          fi
          if [[ ! "$ANC_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=anc audit::anc_version '${ANC_VERSION}' is not an exact release; expected a version such as 0.6.0"
            exit 1
          fi
          case "$ANC_BLOCKING_TIERS" in
            must | any) ;;
            *)
              echo "::error title=anc audit::anc_blocking_tiers is '${ANC_BLOCKING_TIERS}'; expected must or any"
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *install-rust

      - *rust-cache

      - name: Install cargo-binstall
        if: env.RUN_AUDIT == 'true'
        uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.1

      # A second binstall attempt covers a transient release-asset fetch
      # failure; a source build is the fallback after that.
      - &install-anc
        name: Install anc
        if: env.RUN_AUDIT == 'true'
        run: |
          cargo binstall "agentnative@${ANC_VERSION}" --force --no-confirm \
            || cargo binstall "agentnative@${ANC_VERSION}" --force --no-confirm \
            || cargo install "agentnative@${ANC_VERSION}" --locked
          installed="$(anc --version)"
          echo "${installed} (pinned ${ANC_VERSION})"
          if [ "$installed" != "anc ${ANC_VERSION}" ]; then
            echo "::error title=Install anc::found '${installed}' on PATH, expected anc ${ANC_VERSION}"
            exit 1
          fi

      - name: Build the release binary
        run: cargo build --release --locked --bin "$ANC_BIN"

      - name: Release binary size ceiling
        if: inputs.release_size_ceiling_bytes > 0 && env.RUN_AUDIT == 'true'
        run: |
          size="$(stat -c %s "target/release/${ANC_BIN}")"
          echo "target/release/${ANC_BIN} is ${size} bytes (ceiling ${SIZE_CEILING_BYTES})"
          if [ "$size" -gt "$SIZE_CEILING_BYTES" ]; then
            echo "::error title=Release binary size::${ANC_BIN} is ${size} bytes, over the ${SIZE_CEILING_BYTES}-byte ceiling; check that [profile.release] still applies from the workspace root"
            exit 1
          fi

      # anc exits 0 when every row passes, 1 when warnings are present without
      # failures, and 2 on failures, errors, or a usage error. The scorecard
      # decides among the three, and its shape check rejects a usage error's
      # output; any other exit means the audit never ran.
      - &anc-audit
        name: anc audit
        if: env.RUN_AUDIT == 'true'
        run: |
          set -euo pipefail
          status=0
          anc audit . --bin "$ANC_BIN" --output json > anc-scorecard.json || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ] && [ "$status" -ne 2 ]; then
            echo "::error title=anc audit::anc audit exited ${status} without a verdict"
            exit 1
          fi
          jq -e '(.badge.score_pct | type == "number") and (.results | type == "array" and length > 0)' anc-scorecard.json > /dev/null
          jq -r '.results[] | "\(.tier)\t\(.status)\t\(.id)"' anc-scorecard.json | sort > anc-rows.tsv
          score="$(jq -r '.badge.score_pct' anc-scorecard.json)"
          echo "anc score: ${score}% (floor ${ANC_SCORE_FLOOR}%)"
          # `error` rows leave the score's denominator, so a harness that
          # cannot run the binary would otherwise pass at 100.
          blocking="$(jq -r --arg tiers "$ANC_BLOCKING_TIERS" '
            [.results[]
              | select(.status == "fail" or .status == "error")
              | select($tiers == "any" or .tier == "must")
              | "\(.id) (\(.tier // "untiered") \(.status))"]
            | join(", ")' anc-scorecard.json)"
          if [ -n "$blocking" ]; then
            echo "::error title=anc audit::blocking rows: ${blocking}"
            exit 1
          fi
          if ! jq -e --argjson floor "$ANC_SCORE_FLOOR" '.badge.score_pct >= $floor' anc-scorecard.json > /dev/null; then
            echo "::error title=anc audit::score ${score}% is below the ${ANC_SCORE_FLOOR}% floor"
            exit 1
          fi

      - &upload-scorecard
        name: Upload the scorecard
        if: always() && env.RUN_AUDIT == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ANC_SCORECARD }}
          path: |
            anc-scorecard.json
            anc-rows.tsv

  # The tests `Fmt, clippy` leaves out under nextest. GitHub appends each
  # cell's partition to the literal name: `Tests (1/1)`, or `Tests (1/2)` and
  # `Tests (2/2)`. A matrix job skipped whole never expands, and its cells'
  # required checks would wait forever, so `jobs` and `docs_only` skip its
  # steps through RUN_STEPS instead. Every partition compiles the same test
  # binaries under one cache key, so a warm run builds in the first alone.
  tests:
    name: Tests
    if: inputs.test_runner == 'nextest'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Expressions have no arithmetic, so the partitions come from a list
        # indexed by the count.
        partition: ${{ fromJSON('[[],["1/1"],["1/2","2/2"],["1/3","2/3","3/3"],["1/4","2/4","3/4","4/4"]]')[inputs.test_partitions] }}
    env:
      RUN_STEPS: ${{ !inputs.docs_only && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'tests')) && (!inputs.warm_cache || startsWith(matrix.partition, '1/')) }}
      NEXTEST_VERSION: ${{ inputs.nextest_version }}
      PARTITION: ${{ matrix.partition }}
      WARM_CACHE: ${{ inputs.warm_cache }}
      ANC_VERSION: ${{ inputs.anc_version }}
      ANC_BIN: ${{ inputs.anc_bin }}
      ANC_SCORE_FLOOR: ${{ inputs.anc_score_floor }}
      ANC_BLOCKING_TIERS: ${{ inputs.anc_blocking_tiers }}
      ANC_SCORECARD: anc-scorecard-debug
      RUN_AUDIT: ${{ inputs.anc_debug_audit && !inputs.docs_only && !inputs.warm_cache && startsWith(matrix.partition, '1/') && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'tests')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_STEPS == 'true'

      - *install-rust

      - *rust-cache

      - name: Install cargo-binstall
        if: env.RUN_STEPS == 'true' && !inputs.warm_cache
        uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.1

      - name: Install cargo-nextest
        if: env.RUN_STEPS == 'true' && !inputs.warm_cache
        run: |
          set -euo pipefail
          cargo binstall "cargo-nextest@${NEXTEST_VERSION}" --force --no-confirm \
            || cargo binstall "cargo-nextest@${NEXTEST_VERSION}" --force --no-confirm \
            || cargo install "cargo-nextest@${NEXTEST_VERSION}" --locked
          installed="$(cargo nextest --version | head -n 1)"
          echo "${installed} (pinned ${NEXTEST_VERSION})"
          case "$installed" in
            "cargo-nextest ${NEXTEST_VERSION}" | "cargo-nextest ${NEXTEST_VERSION} "*) ;;
            *)
              echo "::error title=Install cargo-nextest::found '${installed}', expected cargo-nextest ${NEXTEST_VERSION}"
              exit 1
              ;;
          esac

      # nextest compiles its binaries with `cargo test --no-run`, so the warm
      # build fills the cache the real run restores.
      - name: Tests
        if: env.RUN_STEPS == 'true'
        run: |
          set -euo pipefail
          if [ "$WARM_CACHE" = true ]; then
            cargo test --no-run
          else
            cargo nextest run --profile ci --partition "hash:${PARTITION}"
          fi

      # nextest runs no doc tests. `cargo test --doc` fails on a package with
      # no library, so it runs only where cargo test would find one.
      - name: Doc tests
        if: env.RUN_STEPS == 'true' && !inputs.warm_cache && startsWith(matrix.partition, '1/')
        run: |
          set -euo pipefail
          if cargo metadata --no-deps --format-version 1 | jq -e '
            .workspace_default_members as $members
            | [.packages[] | select(.id as $id | $members | index($id)) | .targets[] | select(.doctest)]
            | length > 0' > /dev/null; then
            cargo test --doc
          else
            echo "::notice title=Doc tests::no package cargo test selects has a library, so there are no doc tests"
          fi

      - *install-anc

      - name: Build the debug binary
        if: env.RUN_AUDIT == 'true'
        run: cargo build --bin "$ANC_BIN"

      - *anc-audit

      - *upload-scorecard

  changelog-check:
    name: Changelog
    if: ${{ !inputs.warm_cache && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && (inputs.jobs == 'all' || contains(fromJSON(inputs.jobs), 'changelog-check')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check the changelog beside each bumped crate was updated
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Paginated: a release PR carrying a whole tree runs to hundreds of
            // files, and a single page silently drops every crate past the first
            // hundred. That failed open, reporting a release green whose
            // changelog was never looked at.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const changed = files.map(f => f.filename);
            const head = context.payload.pull_request.head.sha;

            // A file's text at the PR head, or null when it does not exist there.
            async function contentAtHead(path) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  ref: head,
                });
                return Buffer.from(data.content, data.encoding).toString('utf8');
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            // Release PRs always bump a package version, so a changed package
            // manifest is the signal. A workspace's virtual root manifest has no
            // `[package]` table and is not a release on its own.
            const manifests = changed.filter(f => f === 'Cargo.toml' || f.endsWith('/Cargo.toml'));
            const bumped = [];
            for (const manifest of manifests) {
              const text = await contentAtHead(manifest);
              if (text === null || !/^\[package\]\s*$/m.test(text)) continue;
              // A crate that is never published has no consumers to tell, so it
              // keeps no changelog and must not be held to one.
              if (/^\s*publish\s*=\s*false\s*(#.*)?$/m.test(text)) {
                core.info(`${manifest} is publish = false. No changelog to keep.`);
                continue;
              }
              bumped.push(manifest);
            }
            if (bumped.length === 0) {
              core.info('No package Cargo.toml changed — not a release PR. Skipping changelog check.');
              return;
            }

            // The changelog beside the crate governs it; a member that keeps
            // none of its own (a workspace's binary that owns the root
            // CHANGELOG.md) is governed by the root one.
            const missing = [];
            for (const manifest of bumped) {
              const dir = manifest.slice(0, manifest.length - 'Cargo.toml'.length);
              const beside = `${dir}CHANGELOG.md`;
              const changelog = dir === '' || (await contentAtHead(beside)) !== null ? beside : 'CHANGELOG.md';
              if (changed.includes(changelog)) {
                core.info(`${changelog} updated for ${manifest}. OK.`);
              } else {
                missing.push(`${changelog} (for ${manifest})`);
              }
            }
            if (missing.length > 0) {
              core.setFailed(
                `Not updated in this PR: ${missing.join(', ')}.\n` +
                'Run: ~/.claude/skills/rust-tool-release/scripts/generate-changelog.sh\n' +
                'Then commit the result.'
              );
            }
