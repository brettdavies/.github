# Reusable CI workflow for brettdavies Rust CLI tools.
# Runs formatting, linting, tests, security audit, and package check.
#
# Caller example:
#   jobs:
#     ci:
#       uses: brettdavies/.github/.github/workflows/rust-ci.yml@main
#
# Required caller permissions: contents: read, pull-requests: read
#
# A caller that declares its own `concurrency:` block covers only the jobs it
# defines itself; this workflow's jobs are covered by the group below. Key the
# caller's group on its own literal token (`ci-${{ github.ref }}`), never on
# `${{ github.workflow }}` alone: see the note on that block for what happens
# when the two keys match.
name: Rust CI

on:
  workflow_call:
    inputs:
      advisories_blocking:
        description: "Fail the run when `cargo deny check advisories` reports a finding. Default false: the advisories row soft-fails so a newly published advisory against an unrelated dependency cannot block every consumer's merges. Set true once the consumer repo is willing to treat an advisory as a stop condition."
        type: boolean
        required: false
        default: false
      windows_nasm:
        description: "Install NASM on the Windows job before cargo runs. Default false. Set true when a dependency assembles on x86-64 Windows (aws-lc-sys, behind rustls's aws-lc-rs provider, does), because neither hosted Windows image ships NASM; cmake, its other build requirement, is preinstalled on every hosted image."
        type: boolean
        required: false
        default: false

# The literal `rust-ci-` prefix is what keeps this group distinct from a
# caller's own. Inside a called workflow `github.workflow` is the *caller's*
# workflow name, so a key built only from context is a key the caller also
# produces: both land in one group, and because this block cancels in progress,
# this workflow's queue cancels the run that called it. That presents as a run
# concluding failure with every visible job green and this workflow's jobs
# absent, with nothing in the logs naming a cause. The caller and ref parts stay
# so two consumers, and two branches of one consumer, still separate.
concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: Fmt, clippy, test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Tests
        run: cargo test

  check-windows:
    name: Windows check
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `cargo check` still runs build scripts, so a C library in the tree is
      # compiled here. choco rather than a marketplace action: the shared
      # workflow gains no new pinned dependency. The package installs under
      # Program Files without touching the step's PATH, so the directory is
      # appended explicitly.
      - name: Install NASM
        if: inputs.windows_nasm && runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress --yes
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\NASM'

      - name: Check (Windows)
        run: cargo check --all-targets

  audit:
    name: Security audit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        checks: [advisories, "bans licenses sources"]
    # The advisories row soft-fails by default because its input is the
    # RustSec database, not the repo: an advisory published overnight against a
    # transitive dependency would otherwise turn every consumer's CI red with no
    # change on their side. The job's own conclusion is still `failure`, so a
    # consumer can require the check in its ruleset to gate merges without
    # opting into a red run. `advisories_blocking: true` additionally fails the
    # run itself.
    continue-on-error: ${{ matrix.checks == 'advisories' && !inputs.advisories_blocking }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  package-check:
    name: Package check
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `--workspace` packages every member together and verifies them against
      # each other, which is the only way to dry-run a member whose path
      # dependency is not on crates.io yet. On a single root package it is the
      # same command as before.
      - name: List package contents
        run: cargo package --list --workspace

      - name: Dry-run publish
        run: cargo publish --dry-run --workspace

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Run shellcheck
        run: |
          mapfile -t shell_files < <({
            git ls-files '*.sh' 2>/dev/null
            git ls-files 'scripts/hooks/*' 2>/dev/null
          } | sort -u)
          if [ ${#shell_files[@]} -eq 0 ]; then
            echo "No tracked shell scripts found. Skipping."
            exit 0
          fi
          printf 'Linting %d file(s):\n' "${#shell_files[@]}"
          printf '  %s\n' "${shell_files[@]}"
          shellcheck --severity=warning "${shell_files[@]}"

  changelog-check:
    name: Changelog
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check the changelog beside each bumped crate was updated
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const changed = files.map(f => f.filename);
            const head = context.payload.pull_request.head.sha;

            // A file's text at the PR head, or null when it does not exist there.
            async function contentAtHead(path) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  ref: head,
                });
                return Buffer.from(data.content, data.encoding).toString('utf8');
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            // Release PRs always bump a package version, so a changed package
            // manifest is the signal. A workspace's virtual root manifest has no
            // `[package]` table and is not a release on its own.
            const manifests = changed.filter(f => f === 'Cargo.toml' || f.endsWith('/Cargo.toml'));
            const bumped = [];
            for (const manifest of manifests) {
              const text = await contentAtHead(manifest);
              if (text !== null && /^\[package\]\s*$/m.test(text)) bumped.push(manifest);
            }
            if (bumped.length === 0) {
              core.info('No package Cargo.toml changed — not a release PR. Skipping changelog check.');
              return;
            }

            // The changelog beside the crate governs it; a member that keeps
            // none of its own (a workspace's binary that owns the root
            // CHANGELOG.md) is governed by the root one.
            const missing = [];
            for (const manifest of bumped) {
              const dir = manifest.slice(0, manifest.length - 'Cargo.toml'.length);
              const beside = `${dir}CHANGELOG.md`;
              const changelog = dir === '' || (await contentAtHead(beside)) !== null ? beside : 'CHANGELOG.md';
              if (changed.includes(changelog)) {
                core.info(`${changelog} updated for ${manifest}. OK.`);
              } else {
                missing.push(`${changelog} (for ${manifest})`);
              }
            }
            if (missing.length > 0) {
              core.setFailed(
                `Not updated in this PR: ${missing.join(', ')}.\n` +
                'Run: ~/.claude/skills/rust-tool-release/scripts/generate-changelog.sh\n' +
                'Then commit the result.'
              );
            }
