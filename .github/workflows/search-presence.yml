# Reusable post-deploy search regression gate for a site repository. Runs the
# search-presence skill's audit of what the deployed site serves crawlers
# against the origin in the site's search-presence.toml, writes the rows to the
# job summary, and fails the job on rows at or above the config's fail_on
# level, or when the audit cannot finish.
#
# The audit only reads the live site, so the job holds no search-engine
# credentials. Submission, Google index state, the Request indexing queue,
# the trend report, and the per-site issue run on a workstation once the
# deploy is live.
#
# Caller example:
#   jobs:
#     search-presence:
#       needs: deploy
#       uses: brettdavies/.github/.github/workflows/search-presence.yml@main
#       permissions:
#         contents: read
#       secrets:
#         SEARCH_PRESENCE_SKILL_TOKEN: ${{ secrets.SEARCH_PRESENCE_SKILL_TOKEN }}
#
# Required caller permissions: contents: read
name: Search Presence

on:
  workflow_call:
    inputs:
      config:
        description: "Path of the site's search-presence.toml, relative to the repository root"
        type: string
        required: false
        default: search-presence.toml
      skill_repository:
        description: "The repository that holds the search-presence skill"
        type: string
        required: false
        default: brettdavies/agent-skills
      skill_ref:
        description: "The branch, tag, or commit of the skill to run"
        type: string
        required: false
        default: main
    secrets:
      SEARCH_PRESENCE_SKILL_TOKEN:
        description: "Fine-grained PAT with Contents: read on the skill's repository only"
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # On the job rather than the workflow, keyed on the config: a caller may
    # call this once per site in one run, and a workflow-level group would put
    # those calls in one group. The audit only reads the live site, so a newer
    # run for the same config supersedes an older one and cancelling it loses
    # nothing.
    concurrency:
      group: search-presence-${{ github.repository }}-${{ inputs.config }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    env:
      SKILL_DIR: ${{ github.workspace }}/skill/search-presence
    steps:
      - name: Check the inputs and the skill token
        env:
          CONFIG: ${{ inputs.config }}
          HAS_SKILL_TOKEN: ${{ secrets.SEARCH_PRESENCE_SKILL_TOKEN != '' }}
        run: |
          if [ "$HAS_SKILL_TOKEN" != true ]; then
            echo "::error::SEARCH_PRESENCE_SKILL_TOKEN is empty. Create it in the calling repository and pass it under secrets:."
            exit 1
          fi
          case "$CONFIG" in
            '' | /* | .. | ../* | */.. | */../*)
              echo "::error::config must be a path inside the repository, without '..': $CONFIG"
              exit 1
              ;;
          esac

      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
          persist-credentials: false

      - name: Check out the skill
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.skill_repository }}
          ref: ${{ inputs.skill_ref }}
          token: ${{ secrets.SEARCH_PRESENCE_SKILL_TOKEN }}
          path: skill
          sparse-checkout: search-presence
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # This version's checksum ships inside the pinned setup-uv, so the
          # download is verified against a hash the pin fixes rather than one
          # fetched at run time.
          version: "0.12.17"
          enable-cache: false

      - name: Read the site config
        id: config
        working-directory: site
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          if [ ! -f "$CONFIG" ]; then
            echo "::error::No site config at $CONFIG. Commit a search-presence.toml, or pass its path as the config input."
            exit 1
          fi
          normalized="$RUNNER_TEMP/search-presence-config.json"
          status=0
          uv run --script "$SKILL_DIR/scripts/fleet.py" validate --config "$CONFIG" --json >"$normalized" || status=$?
          if [ "$status" -ne 0 ]; then
            cat "$normalized"
            echo "::error::$CONFIG is not a valid site config (fleet.py validate exited $status)."
            exit 1
          fi
          origin=$(jq -r '.configs[0].origin' "$normalized")
          fail_on=$(jq -r '.configs[0].fail_on' "$normalized")
          if [[ ! "$origin" =~ ^https?://[a-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::The config's origin is not a plain http(s) origin with an ASCII host: $origin"
            exit 1
          fi
          case "$fail_on" in
            fail | warn) ;;
            *)
              echo "::error::The config's fail_on is neither fail nor warn: $fail_on"
              exit 1
              ;;
          esac
          {
            echo "origin=$origin"
            echo "fail_on=$fail_on"
          } >>"$GITHUB_OUTPUT"

      - name: Audit the deployed site
        env:
          ORIGIN: ${{ steps.config.outputs.origin }}
          FAIL_ON: ${{ steps.config.outputs.fail_on }}
        run: |
          report="$RUNNER_TEMP/search-presence-audit.json"
          status=0
          uv run --script "$SKILL_DIR/scripts/audit_indexability.py" "$ORIGIN" --json >"$report" || status=$?
          if ! jq -e '.rows | type == "array"' "$report" >/dev/null 2>&1; then
            cat "$report"
            message=$(jq -r '.error.message // empty' "$report" 2>/dev/null || true)
            echo "::error::audit_indexability.py exited $status without a report${message:+: $message}"
            echo "The audit of $ORIGIN did not finish (exit $status)${message:+: $message}" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          blocking=$(jq --arg level "$FAIL_ON" \
            '[.rows[] | select(.status == "fail" or ($level == "warn" and .status == "warn"))] | length' "$report")
          jq -r --arg level "$FAIL_ON" '
            def cell: tostring | gsub("\\|"; "\\|") | gsub("\n"; " ");
            def rank: {"fail": 0, "warn": 1, "unknown": 2}[.status];
            def next: .next_step
              | if .action == "none" then "" elif (.command // "") != "" then "`\(.command)`" else .docs // "" end;
            .rows as $rows
            | [$rows[] | select(rank != null)] as $open
            | "### Search regression gate: \(.origin)",
              "",
              "Blocks on `\($level)`\(if $level == "warn" then " and `fail`" else "" end) rows. "
                + "Requests sent as `\(.identity.user_agent // "unrecorded")`.",
              "",
              ([["fail", "warn", "unknown", "info", "pass", "n/a"][] as $s
                | ($rows | map(select(.status == $s)) | length) as $n
                | select($n > 0) | "\($n) \($s)"] | join(", ")),
              "",
              if ($open | length) == 0 then "No fail, warn, or unknown rows."
              else
                "| Status | Row | Check | Subject | Detail | Next step |",
                "| --- | --- | --- | --- | --- | --- |",
                ($open | sort_by(rank)[]
                  | "| \(.status) | \(.id) | \(.title | cell) | \(.subject // "" | cell) | \(.detail | cell) | \(next | cell) |")
              end
          ' "$report" >>"$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] || [ "$blocking" -gt 0 ]; then
            echo "::error::The audit of $ORIGIN exited $status with $blocking row(s) at or above fail_on ($FAIL_ON); the job summary lists them."
            exit 1
          fi
