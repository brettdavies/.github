# Reusable pre-tag build check for brettdavies Rust CLI tools.
# Builds every target the release matrix builds, and releases nothing.
#
# Caller example:
#   jobs:
#     check:
#       uses: brettdavies/.github/.github/workflows/rust-release-matrix-check.yml@main
#
# The release build runs only on a tag push, so a dependency that breaks a
# cross-compiled target is otherwise discovered while cutting the release: the
# tag exists, and the fix lands after a failed publish. A caller runs this at
# the two moments that matter: when its dependency graph or toolchain pin
# changes, which is what breaks a cross build, and on every release branch,
# which is the last point before a tag exists.
#
# Triggers, path filters, and the concurrency group belong to the caller: which
# paths can break a build differs per repo, and this workflow declares no group
# of its own.
#
# The matrix holds the same rows as the build matrix in `rust-release.yml`, and
# `scripts/check-release-matrix-parity.sh` fails the lint run when the two
# differ. Every row is hard-fail here, including the two linux-musl rows the
# release soft-fails unless its caller passes `linux_musl_required: true`. With
# that input set, a red row here means the release would fail on the same row.
#
# Required caller permissions: contents: read
name: Rust Release Matrix Check

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            cross: true
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            cross: true
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      # dtolnay/rust-toolchain honors a consumer's rust-toolchain.toml channel
      # but installs only the host default target, so the matrix target is
      # re-added explicitly. Skipped for cross rows, whose docker image carries
      # its own pre-configured toolchain.
      - name: Ensure target installed
        if: matrix.cross != true
        run: rustup target add ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-matrix-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall cross --version 0.2.5 --no-confirm --force

      - name: Build release
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross }}
        run: |
          BUILD_CMD="cargo"
          if [ "$USE_CROSS" = "true" ]; then
            BUILD_CMD="cross"
          fi
          $BUILD_CMD build --release --locked --target "$TARGET"
