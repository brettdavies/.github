# Reusable actionlint + markdownlint for brettdavies repos.
#
# `pull-requests: read` on the actionlint job carries control's private-repo
# reviewdog note: reviewdog reads the PR diff to scope findings, which a
# private repo denies with `contents: read` alone. Harmless on this public
# repo; required on private callers like meum-control.
#
# Caller example (inside the repo's lint.yml):
#   jobs:
#     basics:
#       uses: brettdavies/.github/.github/workflows/lint-basics.yml@main
#       with:
#         runs-on: ubuntu-24.04
#         markdownlint-globs: '**/*.md'
#
# Required caller permissions: contents: read, pull-requests: read
name: Lint basics

on:
  workflow_call:
    inputs:
      markdownlint:
        description: "Run the markdownlint job"
        type: boolean
        required: false
        default: true
      markdownlint-globs:
        description: "Glob pattern(s) passed to markdownlint-cli2"
        type: string
        required: false
        default: '**/*.md'
      runs-on:
        description: "Runner label for both jobs"
        type: string
        required: false
        default: 'ubuntu-latest'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        uses: reviewdog/action-actionlint@49cb3ce06e5d81452e14b38ad34e4b12a8acfe2b # v1.73.3
        with:
          fail_level: error

  markdownlint:
    if: ${{ inputs.markdownlint }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: ${{ inputs.markdownlint-globs }}
