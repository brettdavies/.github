# Reusable actionlint + markdownlint for meum-id repos.
#
# `pull-requests: read` on the actionlint job carries control's private-repo
# reviewdog note: reviewdog reads the PR diff to scope findings, which a
# private repo denies with `contents: read` alone. Harmless on this public
# repo; required on private callers like meum-control.
#
# Caller example (inside the repo's lint.yml):
#   jobs:
#     basics:
#       uses: brettdavies/.github/.github/workflows/lint-basics.yml@main
#       with:
#         runs-on: ubuntu-24.04
#         markdownlint-globs: '**/*.md'
#
# Required caller permissions: contents: read, pull-requests: read
name: Lint basics

on:
  workflow_call:
    inputs:
      markdownlint:
        description: "Run the markdownlint job"
        type: boolean
        required: false
        default: true
      markdownlint-globs:
        description: "Glob pattern(s) passed to markdownlint-cli2"
        type: string
        required: false
        default: '**/*.md'
      runs-on:
        description: "Runner label for both jobs"
        type: string
        required: false
        default: 'ubuntu-latest'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          fail_level: error

  markdownlint:
    if: ${{ inputs.markdownlint }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: ${{ inputs.markdownlint-globs }}
