# Self-applied caller for this repo's own guard-main-docs reusable workflow.
# Blocks compound-engineering docs (docs/architecture/, docs/brainstorms/, docs/ideation/,
# docs/plans/, docs/research/, docs/reviews/, docs/solutions/) from being merged into main.
#
# Filename differs from the reusable (guard-main-docs.yml) to avoid a
# self-collision. Job key matches the standard convention so the status
# check name is `guard-docs / check-forbidden-docs`.
#
# Uses a local path reference (./...) rather than the external
# `brettdavies/.github/...@main` form so the caller exercises the PR's
# version of the reusable — catches regressions on the PR that introduces
# them, not after merge.
name: Self-guard main from engineering docs

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  guard-docs:
    uses: ./.github/workflows/guard-main-docs.yml
